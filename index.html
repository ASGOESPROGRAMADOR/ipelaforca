<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IPelaForça</title><meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf2d6;--ink:#191916;--gold:#fbdd67;--red:#ff0807;--salmon:#fe6e52;--ring:#b78445;--bar2:#191916;--fs:17px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper)}
body{color:var(--ink);font:var(--fs)/1.5 'Noto Serif','Droid Serif',Georgia,serif;padding:48px 0 56px;min-height:100vh}
.top{position:fixed;top:0;left:0;right:0;height:48px;background:#000;color:var(--gold);z-index:10;display:flex;align-items:center;padding:0 14px;font:500 14px Roboto,Arial,sans-serif}
.top a,.top button{color:var(--gold);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
.top .l{display:flex;align-items:center;gap:6px;min-width:90px;font-size:15px}
.top .c{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.top .r{min-width:90px;text-align:right;font-size:19px}
.bot{position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--bar2);display:flex;align-items:center;justify-content:space-around;z-index:10;padding:0 4px;font:500 15px Roboto,Arial,sans-serif}
.bot a{color:var(--gold);text-decoration:none;padding:16px 4px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot a.on{border-top:3px solid var(--gold);padding-top:13px;color:#fff3b3}
.page{max-width:720px;margin:0 auto;padding:10px 16px 90px}
.h{color:var(--red);text-align:center;text-transform:uppercase;margin:24px 0 6px;font-size:1em;letter-spacing:.02em}
.sub{text-align:right;font-style:italic;margin:4px 0 14px}
.rub{color:var(--red);margin:20px 0 4px}
.rub small{display:block;color:var(--salmon);font-size:.95em}
.cross{display:flex;align-items:flex-start;gap:8px;margin:18px 0 10px;font-weight:700}
.cross i{flex:none;width:20px;height:20px;margin-top:3px;border-radius:3px;background:var(--salmon);position:relative}
.cross i:before{content:"";position:absolute;left:8px;top:3px;width:4px;height:14px;background:var(--paper)}
.cross i:after{content:"";position:absolute;left:3px;top:8px;width:14px;height:4px;background:var(--paper)}
.cross span em{font-style:normal;color:var(--salmon);font-weight:400}
.v{position:relative;padding-left:20px;margin:0 0 14px}
.v>sup{position:absolute;left:0;top:.45em;font:400 9px/1 Roboto,Arial,sans-serif;color:var(--salmon)}
.v b{font-weight:700}
.p .v>sup{color:var(--red)}
.p .v:before{content:"R.";color:var(--red);margin-right:6px}
.menu a{display:block;text-decoration:none;color:var(--ink);padding:16px 14px 14px;margin:14px 0;border:2px solid var(--ring);border-radius:12px;background:rgba(255,255,255,.35)}
.menu a:active{background:rgba(183,132,66,.18)}
.menu .t{display:block;color:var(--red);font-size:1.2em;font-weight:700}
.menu .m{display:block;margin-top:4px;font-style:italic;font-size:.92em}
.menu .s{display:block;margin-top:6px;font:400 12px Roboto,sans-serif;color:var(--salmon);text-transform:uppercase;letter-spacing:.06em}
.title{text-align:center;margin:18px 0 4px}
.title big{display:block;color:var(--red);font-size:2em;font-weight:700;line-height:1.1}
.nv{display:flex;gap:10px;margin:26px 0 0}
.nv a{flex:1;text-align:center;text-decoration:none;color:var(--gold);background:#000;border-radius:10px;padding:12px 6px;font:500 15px Roboto,Arial,sans-serif}
.nv a.off{opacity:.3;pointer-events:none}
.menu a.off{opacity:.55;pointer-events:none}
.rd{display:block;text-align:center;text-decoration:none;color:var(--gold);background:#000;border-radius:10px;padding:12px 6px;margin:6px 0 18px;font:500 15px Roboto,Arial,sans-serif}
.nt{font:400 13px/1.4 Roboto,Arial,sans-serif;color:var(--salmon);text-align:center;margin:6px 0 16px}
.fala{margin:0 0 14px}
</style></head><body>
<div class="top"><div class="l"><a id="back" href="#/" style="display:none">&#8592;</a><a href="#/" id="brand">IPelaForça</a></div><div class="c" id="ct">Decorando pela Força</div><div class="r"><button id="aa" aria-label="Tamanho do texto">Aa</button></div></div>
<main class="page" id="m"></main>
<nav class="bot" id="bot"></nav>
<script>
const D=[{"tema": "Administrativo", "itens": [{"t": "Poder de polícia: lição no deserto", "link": "https://drive.google.com/file/d/1NKIGIu0HznDZ3QeU5C88BuwqOG6JVzjJ/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é o poder de polícia. Guarde o conceito: é a atividade da Administração que limita ou disciplina direito, interesse ou liberdade, em razão do interesse público. Está no artigo 78 do Código Tributário Nacional. Será regular quando exercido pelo órgão competente, nos limites da lei, com processo legal e sem abuso ou desvio de poder. Três atributos: discricionariedade, autoexecutoriedade e coercibilidade. Atenção, a banca adora isto: a multa não é autoexecutória, precisa de execução fiscal. O poder de polícia também gera taxa, mas só pelo exercício regular. Não basta o órgão existir no papel. A taxa não pode ter base de cálculo idêntica à de imposto. Limites: legalidade, proporcionalidade, devido processo e finalidade pública. Revise, estudante. Até a próxima lição.", "id": "1"}, {"t": "Improbidade: acordo de não persecução cível", "link": "https://drive.google.com/file/d/1VbwjXtIqVSFm1BQebZt7pFykx4YUj-_E/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é improbidade: acordo de não persecução cível. Quem pode fazer acordo em improbidade? O acordo de não persecução cível, o ANPC, funciona assim: em vez de seguir com o processo até o fim, o agente devolve o dinheiro, perde a vantagem indevida e aceita as sanções, e a Justiça homologa. A lei nova dizia que só o Ministério Público podia propor. O Supremo corrigiu isso nas ADIs 7042 e 7043. A legitimidade é concorrente, ou seja, os dois podem, e disjuntiva, ou seja, um não precisa do outro. Então o município lesado, pela procuradoria, também pode propor a ação e fazer o acordo. Em prova: se a questão disser que só o Ministério Público pode, está errada. Guarde: Ministério Público e ente lesado, os dois. Revise, estudante. Até a próxima lição.", "id": "2"}, {"t": "Improbidade: dolo e lei nova (Tema 1.199)", "link": "https://drive.google.com/file/d/1GQ6CGpBWh4v91NYtth5tWbM7wGFJjCiX/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é improbidade: dolo e lei nova. Improbidade: o que a lei nova mudou? Antes, até a culpa podia gerar improbidade. A lei nova passou a exigir dolo, a vontade de lesar, e fixou prescrição de oito anos, com intercorrente de quatro. No Tema 1.199, o Supremo decidiu três coisas. Primeira: sem dolo não há improbidade, e isso alcança os processos ainda sem trânsito em julgado. Segunda: a coisa julgada já formada não é desfeita. Terceira: o novo prazo de prescrição não retroage. Em prova: se a questão disser que a lei nova desfaz condenações definitivas, ou que o novo prazo retroage, está errada. Guarde: dolo sempre; coisa julgada fica; prazo novo só para frente. Revise, estudante. Até a próxima lição.", "id": "3"}, {"t": "Responsabilidade do agente: dupla garantia (Tema 940)", "link": "https://drive.google.com/file/d/1SRiC79m70Em5EUGN6XaQdBBgWZEmW-Se/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é responsabilidade do agente público, a dupla garantia. Um servidor causa dano a alguém. Quem a vítima processa? O artigo 37, parágrafo 6º, da Constituição prevê a responsabilidade objetiva do Estado pelos danos que seus agentes causam. No Tema 940, o Supremo firmou a dupla garantia. A ação por dano causado por agente público deve ser proposta contra o Estado, e o agente não é parte legítima nessa ação. Em contrapartida, o Estado tem direito de regresso contra o agente, desde que haja dolo ou culpa. Em prova: se a questão disser que a vítima pode escolher processar diretamente o servidor, está errada, segundo esse tema. Guarde: a vítima processa o Estado; o Estado cobra do agente, se houve dolo ou culpa. Revise, estudante. Até a próxima lição.", "id": "4"}, {"t": "Concurso: o Judiciário não refaz a correção (Tema 485)", "link": "https://drive.google.com/file/d/1_eDNOM28xQd-pUIKrTYaHYX0SplTO9Pf/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é concurso público e correção de prova. O Judiciário pode corrigir a prova de um candidato? No Tema 485, o Supremo decidiu que não compete ao Judiciário substituir a banca examinadora para reavaliar as respostas e as notas atribuídas. O controle judicial é de legalidade: o juiz verifica se o edital e a Constituição foram respeitados, mas não refaz o mérito da correção. Questão fora do conteúdo previsto no edital, por exemplo, pode ser anulada. Em prova: se a questão disser que o juiz pode refazer a correção por discordar do critério, está errada. Guarde: o Judiciário confere a legalidade, não refaz a nota. Revise, estudante. Até a próxima lição.", "id": "5"}]}, {"tema": "Constitucional", "itens": [{"t": "Controle difuso: art. 52, X, e reserva de plenário", "link": "https://drive.google.com/file/d/1SF1Y2DpVRmTswk7eKAVwYVJr7qDwZvyW/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é controle difuso e reserva de plenário. No controle difuso, qualquer juiz pode deixar de aplicar uma lei inconstitucional, mas só no caso concreto. Para valer para todos, o Senado suspende a lei, artigo 52, inciso X. Nas ADIs 3406 e 3470, o Supremo sinalizou efeito amplo sem o Senado, a abstrativização. Já a Súmula Vinculante 10 diz: tribunal só afasta lei por maioria absoluta do plenário ou do órgão especial. Se uma turma afasta a lei sem declarar a inconstitucionalidade, viola a reserva de plenário. Em prova: a resolução do Senado continua no texto, e a SV 10 não alcança o juiz de primeiro grau nem as turmas recursais. Guarde: tribunal, só por plenário; juiz singular, não. Revise, estudante. Até a próxima lição.", "id": "6"}, {"t": "Ação civil pública: coisa julgada sem limite territorial (Tema 1.075)", "link": "", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é ação civil pública e coisa julgada. Ação civil pública protege direitos coletivos. A lei dizia que a coisa julgada nela só valia dentro da competência territorial do juiz que decidiu. Isso limitava muito o alcance das decisões. No Tema 1.075, o Supremo declarou inconstitucional essa limitação territorial do artigo 16 da Lei 7.347. A coisa julgada na ação civil pública é erga omnes: vale para todos os beneficiados, sem fronteira de comarca. Em prova: se a questão disser que a coisa julgada fica restrita ao território do juiz que decidiu, está errada. Guarde: efeito erga omnes, sem limite territorial. Revise, estudante. Até a próxima lição.", "id": "7"}, {"t": "Mínimo existencial e reserva do possível", "link": "", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é mínimo existencial e reserva do possível. Reserva do possível é o argumento de que o Estado não tem dinheiro para cumprir um direito. Mínimo existencial é o núcleo de condições básicas de vida digna, que o Estado precisa garantir sempre. Na ADPF 45, o Supremo firmou que a reserva do possível não pode esvaziar o mínimo existencial. No Tema 220, decidiu que o Judiciário pode determinar obras emergenciais em presídios. No Tema 698, que pode intervir em política pública diante de grave deficiência de direitos fundamentais, mas, como regra, define objetivos e exige da Administração um plano. Em prova: se a questão disser que a separação dos Poderes impede qualquer ordem judicial, está errada. Guarde: o mínimo existencial vence a reserva do possível. Revise, estudante. Até a próxima lição.", "id": "8"}, {"t": "Saúde: quem responde e remédio sem registro", "link": "https://drive.google.com/file/d/1z44P4uvO4lRAmchWwf07l-2YXEF3Vr7U/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é saúde: quem responde e remédio sem registro. Quem paga um tratamento de saúde: União, Estado ou Município? No Tema 793, o Supremo disse que os entes federados são solidariamente responsáveis. O paciente pode acionar qualquer um. Mas o juiz pode direcionar o cumprimento a quem tem a atribuição e determinar o ressarcimento entre os entes. Já para remédio sem registro na Anvisa, no Tema 500, a regra é a vedação, e a competência é da Justiça Federal. A exceção é a demora irrazoável da Anvisa em decidir o pedido de registro. Em prova: solidariedade não impede o juiz de organizar quem cumpre e quem ressarce. Guarde: solidariedade, com direcionamento; sem registro, em regra, não. Revise, estudante. Até a próxima lição.", "id": "9"}]}, {"tema": "Tributário e Financeiro", "itens": [{"t": "Taxa: lixo, iluminação e COSIP", "link": "https://drive.google.com/file/d/1IihEF-TUDRr2r4-kt-Z2jhIbzCe2nExX/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é taxa, lixo, iluminação e COSIP. Taxa só pode ser cobrada por serviço específico e divisível, ou seja, que dê para medir quem usa. A Súmula Vinculante 19 diz que a taxa de coleta domiciliar de lixo é válida. Mas limpeza de vias e serviços gerais não podem ser custeados por taxa. Iluminação pública é serviço geral, indivisível. Pela Súmula Vinculante 41, não pode haver taxa de iluminação. O custeio se faz pela contribuição, a COSIP, e no RE 573.675 o Supremo admitiu alíquotas progressivas conforme o consumo de energia. Em prova: lixo domiciliar, taxa; iluminação, COSIP. Guarde: serviço divisível e específico, taxa; serviço geral, não. Revise, estudante. Até a próxima lição.", "id": "10"}, {"t": "Taxa e tarifa; base de cálculo da taxa", "link": "https://drive.google.com/file/d/1vXZp735lfNvOd52nuX4OItr9Ah4Lxjdy/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é taxa e tarifa, e a base de cálculo da taxa. Taxa e tarifa não são a mesma coisa. Pela Súmula 545 do STJ, a taxa é compulsória e decorre de lei. A tarifa, o preço público, é facultativa: só paga quem usa o serviço. E a base de cálculo da taxa? A Constituição proíbe que ela tenha base própria de imposto. Mas, pela Súmula Vinculante 29, é constitucional a taxa que adote um ou mais elementos da base de cálculo de imposto, desde que não haja identidade integral. Em prova: a banca diz que usar qualquer elemento da base do imposto invalida a taxa. Só a identidade total. Guarde: taxa é compulsória; usar elemento da base do imposto, pode; identidade integral, não. Revise, estudante. Até a próxima lição.", "id": "11"}, {"t": "LRF: despesa com pessoal e limite prudencial", "link": "https://drive.google.com/file/d/1Z-bqjgx8Jwvp8CVg-YinkYxeQ_pQ5LFc/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é a Lei de Responsabilidade Fiscal. A ideia central: gestão planejada e transparente, que previne riscos e mantém o equilíbrio das contas públicas. Despesa com pessoal: Municípios podem gastar no máximo 60 por cento da receita corrente líquida, sendo 54 para o Executivo e 6 para o Legislativo. Passou de 95 por cento do limite, é o limite prudencial: ficam vedados aumento, criação de cargo e contratação, salvo exceções. Estourou o limite? Elimine o excedente em dois quadrimestres, ao menos um terço no primeiro. Atenção: é nulo o ato que aumenta despesa com pessoal nos 180 dias finais do mandato. E nos dois últimos quadrimestres, é vedado assumir despesa que não possa ser paga dentro do mandato, sem caixa. Renúncia de receita exige estimativa de impacto. A transparência vem pelo RREO e pelo RGF. Revise, estudante. Até a próxima lição.", "id": "12"}]}, {"tema": "Civil", "itens": [{"t": "Direitos reais: propriedade", "link": "https://drive.google.com/file/d/1WHBUwe0-GERqlQXBFndcCe0Cn5Pjwax8/view?usp=drive_link", "k": "lit", "txt": "Estudante, aqui é o Dr. Aloisio, e a lição de hoje é Direitos Reais. Primeiro: propriedade imóvel só se transfere com o registro. Escritura pública sozinha não basta. Atenção, a banca adora isto: o caseiro é detentor, não possuidor, e não adquire usucapião. Usucapião extraordinária: quinze anos, ou dez com moradia ou obra produtiva. Urbana especial: cinco anos, até duzentos e cinquenta metros quadrados, para moradia. Familiar: dois anos, quando o ex-cônjuge abandonou o lar. Rural: cinco anos, até cinquenta hectares. Bem público nunca é usucapido. Na posse, a alegação de propriedade não impede a proteção possessória. Possuidor de má-fé só tem direito às benfeitorias necessárias, sem retenção. Hipoteca: é nula a cláusula que proíbe vender o imóvel. Usufruto não se aliena, só o exercício pode ser cedido. Condomínio: indivisão por no máximo cinco anos. Revise, estudante. Até a próxima lição.", "id": "13"}]}];
const m=document.getElementById('m'),back=document.getElementById('back'),ct=document.getElementById('ct'),bot=document.getElementById('bot');
const SZ=[16,17,19,21];let si=1;try{const v=parseInt(localStorage.getItem('ipf_sz'));if(v>=0&&v<SZ.length)si=v}catch(e){}
function applySz(){document.documentElement.style.setProperty('--fs',SZ[si]+'px')}applySz();
document.getElementById('aa').onclick=()=>{si=(si+1)%SZ.length;applySz();try{localStorage.setItem('ipf_sz',si)}catch(e){}};
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const ALL=[];D.forEach(g=>g.itens.forEach(i=>{i.tema=g.tema;ALL.push(i)}));
function home(){
 ct.textContent='Decorando pela Força';back.style.display='none';m.innerHTML='';bot.innerHTML='';
 m.appendChild(el('div','title','<big>IPelaForça</big>'));
 {const q=el('p','sub','Vídeos-aula de jurisprudência: toque no tema e leia o roteiro.');q.style.textAlign='center';m.appendChild(q)}
 D.forEach(g=>{
  const h=el('div','h');h.textContent=g.tema+' ('+g.itens.length+' vídeo'+(g.itens.length>1?'s':'')+')';m.appendChild(h);
  const me=el('div','menu');
  g.itens.forEach(i=>{const a=el('a','','<span class="s"></span><span class="t"></span>');
   a.querySelector('.s').textContent=g.tema;a.querySelector('.t').textContent=i.t;a.href='#/'+i.id;me.appendChild(a)});
  m.appendChild(me);
 });
}
function topic(id){
 const i=ALL.findIndex(x=>x.id===id);if(i<0)return home();const t=ALL[i];
 back.style.display='';back.href='#/';ct.textContent=t.tema;m.innerHTML='';
 m.appendChild(el('div','h')).textContent=t.tema;
 const s=el('p','sub');s.textContent=t.t;m.appendChild(s);
 if(t.link){const a=el('a','rd','▶ Assistir ao vídeo');a.href=t.link;a.target='_blank';a.rel='noopener';m.appendChild(a)}
 m.appendChild(el('div','h','Roteiro do vídeo'));
 if(t.k==='non'){const p=el('p','nt');p.textContent='Roteiro literal ainda não disponível neste app.';m.appendChild(p)}
 else{
  if(t.k==='fic'){const p=el('p','nt');p.textContent='Texto da ficha de estudo deste vídeo (sem a abertura e o fecho da narração).';m.appendChild(p)}
  const d=el('div','fala');d.textContent=t.txt;m.appendChild(d);
 }
 const n=el('div','nv');const pr=el('a',i>0?'':'off','‹ Anterior'),ix=el('a','','Temas'),nx=el('a',i<ALL.length-1?'':'off','Próximo ›');
 pr.href=i>0?'#/'+ALL[i-1].id:'#';ix.href='#/';nx.href=i<ALL.length-1?'#/'+ALL[i+1].id:'#';n.append(pr,ix,nx);m.appendChild(n);
 bot.innerHTML='';
}
function route(){const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(s[0])topic(s[0]);else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
