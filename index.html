re a tutela provisória. Quando o juiz concede? A tutela de urgência exige probabilidade do direito e perigo de dano ou risco ao resultado útil do processo, artigo 300. Não se concede a antecipada quando houver perigo de irreversibilidade dos efeitos, parágrafo 3º. A tutela de evidência, artigo 311, dispensa o perigo, e só nos incisos II e III pode ser concedida liminarmente. Se a antecipada for requerida em caráter antecedente e não houver recurso, ela se estabiliza, artigo 304, e qualquer das partes tem dois anos para rever, em ação própria. Contra a Fazenda Pública, há restrições na Lei 9.494, de 1997, e o artigo 1.059 do Código remete a elas. Em prova: se a questão disser que a tutela estabilizada faz coisa julgada, está errada. Guarde: estabilização não é coisa julgada; dois anos para rever. Revise, estudante. Até a próxima lição.","id":"55","q":{"a":"Tutela provisória","n":21,"d":"MP e ENAM 6, Juiz 11, Defensoria 2, Analista 2; contagem aproximada"}},{"t":"Ação popular: legitimidade, cabimento e coisa julgada","link":"","k":"new","txt":"O assunto de hoje é a ação popular, Lei 4.717. Quem pode propor? O cidadão, com prova do título de eleitor, para anular ato lesivo ao patrimônio público, à moralidade administrativa, ao meio ambiente ou ao patrimônio histórico e cultural, artigo 5º, inciso LXXIII. O autor é isento de custas e de sucumbência, salvo comprovada má-fé. O Ministério Público acompanha a ação, mas não pode ser autor. A coisa julgada é erga omnes, salvo se o pedido for julgado improcedente por insuficiência de provas, caso em que qualquer cidadão pode repropor com nova prova. A prescrição é de cinco anos, artigo 21. Em prova: se a questão disser que o Ministério Público pode propor a ação popular, ou que a improcedência por falta de provas impede nova ação, está errada. Guarde: cidadão autor; improcedência por falta de provas não faz coisa julgada material. Revise, estudante. Até a próxima lição.","id":"61","q":{"a":"Ação popular","n":15,"d":"MP e ENAM 6, Juiz 6, Defensoria 3, Analista 0; contagem aproximada"}},{"t":"Procedimentos especiais: monitória, possessórias e embargos de terceiro","link":"","k":"new","txt":"Hoje o tema são os procedimentos especiais. A ação monitória cabe a quem tem prova escrita sem eficácia de título executivo, artigo 700, e também contra a Fazenda Pública. Expedido o mandado de pagamento, o réu tem quinze dias para pagar ou opor embargos. Se a Fazenda não os opuser, aplica-se a remessa necessária, artigo 701, parágrafo 4º. Nas possessórias, a ação de força nova, de menos de ano e dia, admite liminar, artigo 558. Os embargos de terceiro protegem quem sofre constrição sobre bem de que é possuidor, e, pela Súmula 84 do STJ, o compromissário comprador sem registro também pode opô-los. Em prova: se a questão disser que a monitória não cabe contra a Fazenda Pública, está errada. Guarde: monitória, quinze dias; liminar, até ano e dia; Súmula 84. Revise, estudante. Até a próxima lição.","id":"81","q":{"a":"Procedimentos especiais","n":64,"d":"MP e ENAM 8, Juiz 28, Defensoria 20, Analista 8; contagem aproximada"}},{"t":"Execução e cumprimento de sentença: prazos, multa e impenhorabilidade","link":"","k":"new","txt":"Neste tópico vamos ver a execução em geral. No cumprimento de sentença por quantia, o devedor tem quinze dias para pagar; findo o prazo, incidem multa de dez por cento e honorários de dez por cento, artigo 523. A impugnação é apresentada em quinze dias e independe de penhora. Na execução de título extrajudicial, o executado é citado para pagar em três dias, e os honorários de dez por cento caem pela metade se pagar nesse prazo, artigo 827. Os embargos têm quinze dias e, em regra, não suspendem a execução, artigo 919. São impenhoráveis, entre outros, os salários e o bem de família, artigo 833 e Lei 8.009. Em prova: se a questão disser que os embargos à execução suspendem sempre o processo, ou que o salário é penhorável em qualquer valor, está errada. Guarde: quinze dias, multa dez; três dias; embargos sem efeito suspensivo. Revise, estudante. Até a próxima lição.","id":"82","q":{"a":"Execução e cumprimento de sentença","n":64,"d":"MP e ENAM 0, Juiz 41, Defensoria 12, Analista 6; contagem aproximada"}},{"t":"Petição inicial: requisitos, emenda e indeferimento","link":"","k":"new","txt":"O assunto de hoje é a petição inicial. Os requisitos estão no artigo 319: juízo, partes, fatos e fundamentos, pedido, valor da causa, provas e opção pela audiência de conciliação. Se houver defeito sanável, o juiz manda emendar em quinze dias, artigo 321, e só depois indefere. A inicial é inepta quando falta pedido ou causa de pedir, quando o pedido é indeterminado, fora das hipóteses legais, ou quando a conclusão não decorre da narração, artigo 330. Nas causas repetitivas, o artigo 332 permite a improcedência liminar, sem citação, contra súmula, acórdão repetitivo ou IRDR. Diante de indícios de litigância abusiva, o STJ admite que o juiz exija a emenda para demonstrar o interesse de agir. Em prova: se a questão disser que o juiz indefere a inicial sem oportunizar a emenda, está errada. Guarde: emendar antes de indeferir; improcedência liminar sem citação. Revise, estudante. Até a próxima lição.","id":"83","q":{"a":"Petição inicial","n":64,"d":"MP e ENAM 7, Juiz 35, Defensoria 12, Analista 7; contagem aproximada"}},{"t":"Recursos: especial, extraordinário e embargos de declaração","link":"","k":"new","txt":"Hoje vamos aos recursos aos tribunais superiores. O especial cabe de causa decidida em única ou última instância por tribunal, artigo 105 da Constituição; o extraordinário exige repercussão geral. O prazo é de quinze dias úteis, em dobro para a Fazenda. Exige-se o prequestionamento, Súmulas 282 e 356 do STF, e não se reexaminam provas, Súmula 7 do STJ, nem cláusulas contratuais, Súmula 5. Os embargos de declaração cabem em cinco dias contra omissão, contradição, obscuridade ou erro material, artigo 1.022, e interrompem o prazo dos demais recursos. Em prova: se a questão disser que o recurso especial serve para rever a prova dos autos, ou que os embargos de declaração suspendem o prazo e não o interrompem, está errada. Guarde: pré-questionar; Súmula 7; embargos, cinco dias e interrupção. Revise, estudante. Até a próxima lição.","id":"90","q":{"a":"Recursos em geral","n":40,"d":"MP e ENAM 0, Juiz 27, Defensoria 8, Analista 2; contagem aproximada"}},{"t":"Procedimento comum: saneamento e fundamentação da sentença","link":"","k":"new","txt":"O estudo de hoje é o procedimento comum. O réu contesta em quinze dias úteis, e a Fazenda, em trinta. Encerrada a fase postulatória, o juiz julga conforme o estado do processo, antecipadamente, no todo ou em parte, ou sanea o feito, artigo 357, delimitando as questões de fato, distribuindo o ônus da prova e designando a audiência. A sentença deve ser fundamentada, e o artigo 489, parágrafo 1º, considera sem fundamentação a decisão que invoca ato normativo sem explicar, usa conceito indeterminado sem concretizar, ignora argumento capaz de infirmar a conclusão ou aplica precedente sem identificar os fundamentos. A sentença deve respeitar o pedido, artigo 492. Em prova: se a questão disser que o juiz pode julgar além do pedido, ou que basta citar a ementa do precedente, está errada. Guarde: saneamento; fundamentar; congruência. Revise, estudante. Até a próxima lição.","id":"91","q":{"a":"Procedimento comum e sentença","n":32,"d":"MP e ENAM 4, Juiz 17, Defensoria 8, Analista 2; contagem aproximada"}},{"t":"Direito internacional: tratados, cooperação e sentença estrangeira","link":"","k":"new","txt":"Hoje o tema é o direito internacional. O Presidente celebra o tratado, o Congresso o aprova por decreto legislativo, e ele é promulgado por decreto. Os tratados de direitos humanos aprovados com três quintos em cada Casa, em dois turnos, têm status de emenda; os demais têm caráter supralegal, como no caso da prisão do depositário infiel, Súmula Vinculante 25. A cooperação jurídica internacional, artigos 26 a 41 do CPC, se faz por carta rogatória, que exige exequatur do STJ, e por auxílio direto. A sentença estrangeira precisa de homologação do STJ. É exclusiva da justiça brasileira a ação sobre imóveis situados no Brasil. O Estado estrangeiro não tem imunidade de jurisdição nas causas trabalhistas, Tema 944. Em prova: se a questão disser que a sentença estrangeira produz efeitos no Brasil sem homologação, está errada. Guarde: STJ homologa; imóvel no Brasil, justiça brasileira. Revise, estudante. Até a próxima lição.","id":"108","q":{"a":"Direito internacional","n":39,"d":"MP e ENAM 0, Juiz 22, Defensoria 7, Analista 3; contagem aproximada"}},{"t":"Competência da Justiça Federal e conflito de competência","link":"","k":"new","txt":"O tema de hoje é a competência da Justiça Federal, artigo 109 da Constituição. Cabe a ela julgar as causas em que a União, entidade autárquica ou empresa pública federal forem interessadas. As sociedades de economia mista federais, como o Banco do Brasil, respondem na Justiça Estadual, Súmulas 556 do Supremo e 42 do STJ. Pela Súmula 150 do STJ, cabe ao juiz federal decidir se há interesse da União. Para o gestor municipal, a Súmula 208 manda à Justiça Federal o prefeito acusado de desviar verba sujeita à prestação de contas a órgão federal, e a Súmula 209 mantém na Justiça Estadual o desvio de verba transferida e já incorporada ao patrimônio municipal. Em prova: se a questão disser que a sociedade de economia mista federal é julgada na Justiça Federal, está errada. Guarde: autarquia e empresa pública, federal; economia mista, estadual; Súmulas 208 e 209. Revise, estudante. Até a próxima lição.","id":"110","q":{"a":"Competência da Justiça Federal","n":23,"d":"MP e ENAM 0, Juiz 13, Defensoria 3, Analista 1; contagem aproximada"}}]},{"tema":"Civil","itens":[{"t":"Direitos reais: propriedade","link":"https://drive.google.com/file/d/1WHBUwe0-GERqlQXBFndcCe0Cn5Pjwax8/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é Direitos Reais. Primeiro: propriedade imóvel só se transfere com o registro. Escritura pública sozinha não basta. Atenção, a banca adora isto: o caseiro é detentor, não possuidor, e não adquire usucapião. Usucapião extraordinária: quinze anos, ou dez com moradia ou obra produtiva. Urbana especial: cinco anos, até duzentos e cinquenta metros quadrados, para moradia. Familiar: dois anos, quando o ex-cônjuge abandonou o lar. Rural: cinco anos, até cinquenta hectares. Bem público nunca é usucapido. Na posse, a alegação de propriedade não impede a proteção possessória. Possuidor de má-fé só tem direito às benfeitorias necessárias, sem retenção. Hipoteca: é nula a cláusula que proíbe vender o imóvel. Usufruto não se aliena, só o exercício pode ser cedido. Condomínio: indivisão por no máximo cinco anos. Revise, estudante. Até a próxima lição.","id":"13","q":{"a":"Direitos reais","n":52,"d":"MP e ENAM 12, Juiz 27, Defensoria 12, Analista 1; contagem aproximada"}},{"t":"Sucessão: cônjuge e companheiro (Temas 809 e 498)","link":"","k":"new","txt":"O estudo de hoje é sobre a sucessão do cônjuge e do companheiro. Quando alguém morre, cônjuge e companheiro herdam do mesmo jeito? O artigo 1.790 do Código Civil dava ao companheiro menos direitos que ao cônjuge. No Tema 809, e também no Tema 498, o Supremo declarou inconstitucional essa distinção de regimes sucessórios. Aplica-se a ambos o regime do artigo 1.829 do Código Civil. Atenção à modulação: vale para inventários judiciais em que a sentença de partilha ainda não transitou em julgado, e para partilhas extrajudiciais sem escritura pública lavrada. Em prova: se a questão disser que o artigo 1.790 continua valendo, ou que a decisão desfaz partilhas já concluídas, está errada. Guarde: mesmo regime para os dois; partilha concluída fica. Revise, estudante. Até a próxima lição.","id":"15","q":{"a":"Sucessões","n":63,"d":"MP e ENAM 12, Juiz 29, Defensoria 16, Analista 6; contagem aproximada"}},{"t":"Contratos no Código Civil: função social, lesão e onerosidade excessiva","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre os contratos no Código Civil. Quais princípios os regem? Autonomia privada, limitada pela função social, artigo 421, e pela boa-fé objetiva, artigo 422. Entre os defeitos do negócio, a lesão, artigo 157, exige premente necessidade ou inexperiência e prestação desproporcional, e o estado de perigo, artigo 156, o risco de dano grave. Ambos tornam o negócio anulável. Já a onerosidade excessiva, artigo 478, por fato extraordinário e imprevisível, permite resolver o contrato, e o réu pode evitar a resolução oferecendo modificação equitativa, artigo 479. Em prova: se a questão disser que o contrato com onerosidade excessiva é nulo de pleno direito, ou que a lesão o torna nulo, está errada. Guarde: lesão e perigo, anulável; onerosidade excessiva, resolução ou revisão. Revise, estudante. Até a próxima lição.","id":"29","q":{"a":"Contratos (Código Civil)","n":102,"d":"MP e ENAM 22, Juiz 63, Defensoria 13, Analista 4; contagem aproximada"}},{"t":"Responsabilidade civil no Código Civil: elementos, objetiva e súmulas","link":"","k":"new","txt":"O estudo de hoje é sobre a responsabilidade civil no Código Civil. Quem causa dano, repara? Pelo artigo 927, aquele que, por ato ilícito, causa dano a outrem fica obrigado a repará-lo. A responsabilidade é objetiva nos casos da lei ou quando a atividade implicar risco, parágrafo único. O empregador responde objetivamente pelos empregados, artigos 932 e 933. A indenização mede-se pela extensão do dano, artigo 944. Dano moral e dano material podem ser cumulados, Súmula 37 do STJ, e também o estético e o moral, Súmula 387. Nos danos extracontratuais, os juros correm desde o evento danoso, Súmula 54. Em prova: se a questão disser que o empregador só responde pelo empregado se provada sua culpa, ou que não se cumulam dano moral e material, está errada. Guarde: empregador, responsabilidade objetiva; juros, do evento danoso. Revise, estudante. Até a próxima lição.","id":"48","q":{"a":"Responsabilidade civil (Código Civil)","n":61,"d":"MP e ENAM 13, Juiz 34, Defensoria 6, Analista 8; contagem aproximada"}},{"t":"Negócio jurídico: nulidade, anulabilidade e prazos","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a invalidade do negócio jurídico. Qual é a diferença entre nulidade e anulabilidade? É nulo o negócio celebrado por absolutamente incapaz, de objeto ilícito, simulado ou que fraude a lei, artigo 166. A simulação o torna nulo, mas subsiste o negócio dissimulado, se válido na substância e na forma, artigo 167. É anulável o negócio por incapacidade relativa, erro, dolo, coação, estado de perigo, lesão e fraude contra credores, artigo 171. A nulidade não se convalida pelo decurso do tempo, artigo 169, e pode ser declarada de ofício. A anulação, em regra, decai em quatro anos, artigo 178, e só as partes a podem alegar. Em prova: se a questão disser que o negócio nulo se convalida com o tempo, ou que o juiz anula de ofício o negócio anulável, está errada. Guarde: nulo, sem prazo e de ofício; anulável, quatro anos. Revise, estudante. Até a próxima lição.","id":"49","q":{"a":"Negócio jurídico e obrigações","n":60,"d":"MP e ENAM 8, Juiz 40, Defensoria 5, Analista 7; contagem aproximada"}},{"t":"Prescrição e decadência: prazos e a Fazenda","link":"","k":"new","txt":"O assunto de hoje é a prescrição e a decadência. Qual é a diferença? A prescrição atinge a pretensão, artigo 189 do Código Civil, e pode ser interrompida ou suspensa. A decadência atinge o direito potestativo, e não se suspende nem se interrompe, salvo disposição legal, artigo 207. A reparação civil prescreve em três anos, artigo 206, parágrafo 3º, inciso V, e a pretensão de cobrança de dívidas líquidas, em cinco anos, parágrafo 5º. Contra a Fazenda Pública, o prazo é de cinco anos, Decreto 20.910, de 1932, e o STJ, no Tema 553, afastou o prazo de três anos do Código Civil. A prescrição consumada pode ser renunciada, artigo 191. Em prova: se a questão disser que a indenização contra a Fazenda prescreve em três anos, está errada. Guarde: contra a Fazenda, cinco anos; decadência não se interrompe. Revise, estudante. Até a próxima lição.","id":"50","q":{"a":"Prescrição e decadência (civil e Fazenda)","n":57,"d":"MP e ENAM 5, Juiz 41, Defensoria 9, Analista 2; contagem aproximada"}},{"t":"Família: divórcio, regime de bens e alimentos","link":"","k":"new","txt":"O assunto de hoje é o direito de família. Para se divorciar, é preciso antes a separação judicial? Não. Após a Emenda 66, de 2010, o divórcio é direto, e no Tema 1.053 o Supremo decidiu que a separação judicial deixou de ser requisito. Quanto ao regime de bens, a separação é obrigatória para quem tem mais de setenta anos, artigo 1.641, mas no Tema 1.236 o Supremo admitiu afastá-la por manifestação de vontade, em escritura pública. Sobre os alimentos, a Súmula 309 do STJ autoriza a prisão civil pelas três últimas prestações anteriores à execução e as que vencerem no curso do processo. Em prova: se a questão disser que a prisão civil alcança qualquer dívida alimentar antiga, ou que a separação judicial é requisito do divórcio, está errada. Guarde: divórcio direto; alimentos, as três últimas parcelas. Revise, estudante. Até a próxima lição.","id":"53","q":{"a":"Família","n":51,"d":"MP e ENAM 11, Juiz 18, Defensoria 20, Analista 2; contagem aproximada"}},{"t":"Pessoa natural e pessoa jurídica","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre as pessoas no Código Civil. Quando começa a personalidade? Com o nascimento com vida, mas a lei põe a salvo, desde a concepção, os direitos do nascituro, artigo 2º. São absolutamente incapazes apenas os menores de dezesseis anos, artigo 3º, depois do Estatuto da Pessoa com Deficiência. A capacidade cessa aos dezoito anos ou pela emancipação. A pessoa jurídica de direito privado começa com o registro de seus atos constitutivos, artigo 45. E a desconsideração da personalidade jurídica exige abuso, caracterizado por desvio de finalidade ou confusão patrimonial, artigo 50. Em prova: se a questão disser que a desconsideração exige apenas o inadimplemento da sociedade, ou que o deficiente é absolutamente incapaz, está errada. Guarde: desconsideração exige abuso; só menores de dezesseis são absolutamente incapazes. Revise, estudante. Até a próxima lição.","id":"54","q":{"a":"Pessoa natural e jurídica","n":50,"d":"MP e ENAM 12, Juiz 29, Defensoria 7, Analista 2; contagem aproximada"}},{"t":"Locação de imóveis urbanos: denúncia vazia, preferência e fiança","link":"","k":"new","txt":"O estudo de hoje é sobre a locação de imóveis urbanos, Lei 8.245. Quando o locador pode retomar o imóvel sem motivo? Na denúncia vazia, o contrato escrito com prazo igual ou superior a trinta meses cessa de pleno direito no fim do prazo, artigo 46. Nos de prazo menor, prorrogados por prazo indeterminado, basta notificar o locatário. O locatário tem direito de preferência na venda do imóvel, artigo 27, e o locador responde por perdas e danos se vender sem lhe dar essa chance. A Súmula 549 do STJ confirma a penhorabilidade do bem de família do fiador de contrato de locação. Em prova: se a questão disser que o bem de família do fiador é impenhorável na locação, ou que o inquilino não tem direito de preferência, está errada. Guarde: trinta meses, retomada sem notificação; fiador, bem penhorável. Revise, estudante. Até a próxima lição.","id":"66","q":{"a":"Locação de imóveis","n":22,"d":"MP e ENAM 0, Juiz 17, Defensoria 4, Analista 1; contagem aproximada"}},{"t":"Contratos bancários: CDC, juros e fraude","link":"","k":"new","txt":"O estudo de hoje é sobre os contratos bancários. O Código de Defesa do Consumidor se aplica às instituições financeiras? Sim, Súmula 297 do STJ. Mas, nos contratos bancários, é vedado ao juiz conhecer de ofício da abusividade das cláusulas, Súmula 381. A capitalização de juros em periodicidade inferior à anual é permitida, desde que expressamente pactuada, Súmula 539. E a Súmula 479 diz que as instituições financeiras respondem objetivamente pelos danos causados por fortuito interno, como as fraudes e os delitos praticados por terceiros no âmbito de operações bancárias. Em prova: se a questão disser que o Código de Defesa do Consumidor não se aplica aos bancos, ou que o juiz pode reconhecer de ofício a abusividade de cláusulas de contrato bancário, está errada. Guarde: banco, consumidor; fraude de terceiro, responsabilidade objetiva. Revise, estudante. Até a próxima lição.","id":"75","q":{"a":"Instituições financeiras e contratos bancários","n":20,"d":"MP e ENAM 4, Juiz 10, Defensoria 3, Analista 3; contagem aproximada"}},{"t":"Registros públicos: princípios, propriedade e dúvida","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre os registros públicos, Lei 6.015. A propriedade do imóvel se transfere com o contrato de compra e venda? Não: só com o registro do título no cartório de imóveis, artigo 1.245 do Código Civil, e, enquanto não for registrado, continua dono o alienante. Entre os princípios estão a publicidade, a fé pública, a prioridade, a especialidade, a legalidade e a continuidade. O registro acrescenta o ato à matrícula, e a averbação a modifica. Se o oficial se recusa a registrar um título, o interessado pode requerer a suscitação de dúvida, artigo 198, julgada pelo juiz competente em procedimento de natureza administrativa. Em prova: se a questão disser que a escritura de compra e venda transfere a propriedade do imóvel, está errada. Guarde: propriedade imóvel, só com o registro. Revise, estudante. Até a próxima lição.","id":"76","q":{"a":"Registros públicos","n":6,"d":"MP e ENAM 0, Juiz 5, Defensoria 1, Analista 0; contagem aproximada"}},{"t":"Sucessões: legítima, testamento e herança vacante","link":"","k":"new","txt":"O assunto de hoje é o direito das sucessões. Aberta a sucessão com a morte, a herança se transmite desde logo aos herdeiros, a chamada saisine, artigo 1.784. Os herdeiros necessários, descendentes, ascendentes e cônjuge, têm direito à legítima, metade da herança, e o testador só dispõe livremente da outra metade. A renúncia à herança deve ser expressa, por escritura pública ou termo judicial. Na falta de herdeiros até o quarto grau, a herança é declarada vacante, e, decorridos cinco anos da abertura da sucessão, os bens arrecadados passam ao domínio do Município. Em prova: se a questão disser que a herança vacante pertence ao Município logo após a declaração de vacância, ou que a renúncia pode ser tácita, está errada. Guarde: saisine; legítima, metade; vacante, Município após cinco anos. Revise, estudante. Até a próxima lição.","id":"79","q":{"a":"Sucessões","n":79,"d":"MP e ENAM 0, Juiz 45, Defensoria 25, Analista 8; contagem aproximada"}},{"t":"Direitos reais: posse, usucapião, usufruto e servidões","link":"","k":"new","txt":"A lição de hoje trata dos direitos reais. A usucapião extraordinária exige quinze anos de posse, reduzidos a dez se houver moradia ou obras produtivas; a ordinária, dez anos, ou cinco, se o imóvel foi adquirido onerosamente. A especial urbana exige cinco anos e área de até duzentos e cinquenta metros quadrados. Os bens públicos não se adquirem por usucapião, artigos 183 e 191 da Constituição, e, pela Súmula 619 do STJ, a ocupação de bem público é mera detenção. O usufruto é temporário e intransmissível, mas seu exercício pode ser cedido. A servidão não se presume e exige registro. Em prova: se a questão disser que a ocupação de área pública gera posse e direito a indenização por acessões, ou que o usufruto se transmite por herança, está errada. Guarde: bem público não usucape; usufruto, intransmissível. Revise, estudante. Até a próxima lição.","id":"85","q":{"a":"Direitos reais","n":56,"d":"MP e ENAM 0, Juiz 29, Defensoria 17, Analista 3; contagem aproximada"}},{"t":"Contratos em espécie: compra e venda, doação e fiança","link":"","k":"new","txt":"No tópico de hoje, os contratos em espécie. Na compra e venda, o vendedor responde pelos vícios redibitórios: o comprador escolhe entre rejeitar a coisa ou pedir abatimento, e o prazo é de trinta dias para bens móveis e um ano para imóveis, contados da entrega. Na doação, é nula a de todos os bens sem reserva de renda, e a inoficiosa excede a legítima. A doação pode ser revogada por ingratidão em um ano. A fiança exige forma escrita, interpreta-se restritivamente e garante o benefício de ordem; pela Súmula 332 do STJ, a fiança sem outorga uxória é ineficaz por inteiro. Em prova: se a questão disser que a fiança pode ser interpretada extensivamente, ou que é válida em parte sem a outorga do cônjuge, está errada. Guarde: vício, trinta dias e um ano; fiança, interpretação restrita. Revise, estudante. Até a próxima lição.","id":"86","q":{"a":"Contratos em espécie","n":50,"d":"MP e ENAM 0, Juiz 31, Defensoria 7, Analista 4; contagem aproximada"}},{"t":"LINDB: vigência, aplicação e conflito de leis no espaço","link":"","k":"new","txt":"O estudo de hoje é a Lei de Introdução, no direito civil. A lei começa a vigorar em quarenta e cinco dias após publicada, se não dispuser de outro modo, e vigora até que outra a modifique ou revogue. A lei geral não revoga a especial, e a repristinação só ocorre se houver disposição expressa. A lei nova tem efeito imediato, mas respeita o ato jurídico perfeito, o direito adquirido e a coisa julgada, artigo 6º. Na omissão da lei, o juiz decide por analogia, costumes e princípios gerais. No direito internacional privado, a lei do domicílio da pessoa rege o nome, a personalidade e a capacidade, e a sucessão obedece à lei do domicílio do falecido. Em prova: se a questão disser que a revogação da lei revogadora restaura a lei antiga automaticamente, está errada. Guarde: quarenta e cinco dias; sem repristinação; domicílio. Revise, estudante. Até a próxima lição.","id":"99","q":{"a":"LINDB no direito civil","n":10,"d":"MP e ENAM 5, Juiz 1, Defensoria 1, Analista 3; contagem aproximada"}},{"t":"Direitos da personalidade","link":"","k":"new","txt":"O assunto de hoje são os direitos da personalidade, artigos 11 a 21 do Código Civil. São intransmissíveis e irrenunciáveis, e seu exercício não pode sofrer limitação voluntária, salvo previsão legal. Em caso de ameaça ou lesão, cabe tutela inibitória e reparação. Os legitimados para a proteção do morto são o cônjuge e os parentes em linha reta ou colaterais até o quarto grau. A pessoa jurídica também tem direitos da personalidade, no que couber, e pode sofrer dano moral, Súmula 227 do STJ. A indenização pelo uso não autorizado da imagem com fins econômicos independe de prova do prejuízo, Súmula 403. O Supremo, na ADI 4815, dispensou a autorização prévia para biografias, e no Tema 786 afastou o direito ao esquecimento. Em prova: se a questão disser que a biografia depende de autorização prévia do biografado, está errada. Guarde: personalidade, intransmissível; biografia, livre. Revise, estudante. Até a próxima lição.","id":"111","q":{"a":"Direitos da personalidade","n":14,"d":"MP e ENAM 4, Juiz 7, Defensoria 2, Analista 1; contagem aproximada"}}]},{"tema":"Urbanístico e Ambiental","itens":[{"t":"Direito ambiental: responsabilidade, propter rem e ônus da prova","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a responsabilidade ambiental. O artigo 225 da Constituição impõe ao poder público e à coletividade o dever de defender o meio ambiente. A responsabilidade civil por dano ambiental é objetiva, solidária e fundada no risco integral. As obrigações ambientais têm natureza propter rem, Súmula 623 do STJ, e acompanham o imóvel, mesmo que o dano tenha sido causado pelo dono anterior. A inversão do ônus da prova aplica-se às ações de degradação ambiental, Súmula 618 do STJ. A pretensão de reparação do dano ambiental é imprescritível, Tema 999 do Supremo. Em prova: se a questão disser que o adquirente do imóvel não responde pelo passivo ambiental deixado pelo antigo dono, ou que a reparação do dano ambiental prescreve em cinco anos, está errada. Guarde: objetiva, solidária, propter rem e imprescritível. Revise, estudante. Até a próxima lição.","id":"51","q":{"a":"Direito ambiental geral","n":55,"d":"MP e ENAM 18, Juiz 32, Defensoria 3, Analista 2; contagem aproximada"}},{"t":"Direito urbanístico: função social e IPTU progressivo","link":"","k":"new","txt":"O assunto de hoje é o direito urbanístico, Estatuto da Cidade, Lei 10.257. A propriedade urbana cumpre sua função social quando atende às exigências do plano diretor, artigo 182 da Constituição, obrigatório para cidades com mais de vinte mil habitantes. Se o solo for não edificado ou subutilizado, o Município exige parcelamento, edificação ou utilização compulsórios. Descumprida a exigência, aplica-se o IPTU progressivo no tempo, por cinco anos, com alíquota máxima de quinze por cento, e depois a desapropriação com pagamento em títulos da dívida pública. A usucapião especial urbana exige área de até duzentos e cinquenta metros quadrados e cinco anos de posse. Em prova: se a questão disser que a desapropriação urbanística é paga em dinheiro, está errada. Guarde: parcelar, IPTU progressivo, desapropriação com títulos. Revise, estudante. Até a próxima lição.","id":"77","q":{"a":"Direito urbanístico","n":5,"d":"MP e ENAM 0, Juiz 3, Defensoria 2, Analista 0; contagem aproximada"}},{"t":"Ambiental: licenciamento, Código Florestal e unidades de conservação","link":"","k":"new","txt":"Vamos ao ponto de hoje: licenciamento e áreas protegidas. Pela Lei Complementar 140, o licenciamento é feito por um único ente, e o Município licencia atividades de impacto local, artigo 9º. Se o órgão competente se omitir, a atuação supletiva dos demais é admitida, artigo 15. No Código Florestal, Lei 12.651, a faixa de preservação permanente de rios com até dez metros de largura é de trinta metros, e a reserva legal é de vinte por cento nas áreas fora da Amazônia Legal. O CAR é registro obrigatório. Pelo SNUC, Lei 9.985, as unidades de proteção integral, como o parque, admitem só uso indireto, e as de uso sustentável, como a APA, conciliam conservação e uso. Em prova: se a questão disser que o licenciamento é feito por vários entes sobre a mesma atividade, ou que o parque nacional admite uso direto, está errada. Guarde: licença única; APP trinta; parque, uso indireto. Revise, estudante. Até a próxima lição.","id":"89","q":{"a":"Licenciamento e Código Florestal","n":43,"d":"MP e ENAM 10, Juiz 20, Defensoria 5, Analista 0; contagem aproximada"}}]},{"tema":"Trabalho","itens":[{"t":"Contratação sem concurso e terceirização na Administração","link":"","k":"new","txt":"O estudo de hoje é sobre o contrato de trabalho com a Administração Pública. A contratação sem concurso é nula, artigo 37, parágrafo 2º, e, pela Súmula 363 do TST, só dá direito ao pagamento da contraprestação pactuada, e aos depósitos do FGTS. Sobre a terceirização, no julgamento da ADC 16, o Supremo decidiu que o inadimplemento do contratado não transfere automaticamente à Administração a responsabilidade pelos encargos. Ela responde subsidiariamente se ficar comprovada a falha na fiscalização do contrato, o que é a Súmula 331, item V, do TST. Em prova: se a questão disser que a Administração responde automaticamente pelas verbas trabalhistas da empresa terceirizada, está errada. Guarde: sem concurso, só salário e FGTS; terceirização, responsabilidade subsidiária só com culpa na fiscalização. Revise, estudante. Até a próxima lição.","id":"63","q":{"a":"Trabalho e Justiça do Trabalho","n":40,"d":"MP e ENAM 11, Juiz 10, Defensoria 6, Analista 13; contagem aproximada"}},{"t":"Direito do Trabalho: jornada, rescisão e prescrição","link":"","k":"new","txt":"O estudo de hoje é o contrato de trabalho. A jornada é de oito horas diárias e quarenta e quatro semanais, artigo 7º da Constituição, e as horas extras têm adicional mínimo de cinquenta por cento. Há férias anuais com acréscimo de um terço. O FGTS é de oito por cento, e, na dispensa sem justa causa, o empregador paga multa de quarenta por cento sobre o saldo. O aviso prévio é de trinta dias, mais três por ano de serviço, até noventa. A prescrição é de cinco anos para os créditos, até o limite de dois anos após a extinção do contrato. A gestante tem estabilidade desde a confirmação da gravidez até cinco meses após o parto. Em prova: se a questão disser que o servidor estatutário tem direito ao FGTS, ou que a prescrição trabalhista é de dez anos, está errada. Guarde: 44 horas; multa de 40; prescrição 5 e 2. Revise, estudante. Até a próxima lição.","id":"84","q":{"a":"Direito do Trabalho","n":62,"d":"MP e ENAM 11, Juiz 13, Defensoria 12, Analista 26; contagem aproximada"}}]},{"tema":"Empresarial","itens":[{"t":"Sociedades empresariais: limitada, anônima e desconsideração","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre as sociedades empresariais. Na sociedade limitada, a responsabilidade de cada sócio é restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social, artigo 1.052 do Código Civil. Na anônima, Lei 6.404, o capital se divide em ações, e o acionista responde pelo preço de emissão das ações que subscrever. A desconsideração da personalidade jurídica exige abuso, artigo 50, e o procedimento judicial é o incidente do artigo 133 do Código de Processo Civil. As estatais podem ser empresa pública ou sociedade de economia mista, a última sempre sob forma de sociedade anônima. Em prova: se a questão disser que a sociedade de economia mista pode ser limitada, está errada. Guarde: limitada, quotas e capital; economia mista, sempre anônima. Revise, estudante. Até a próxima lição.","id":"64","q":{"a":"Sociedades empresariais","n":74,"d":"MP e ENAM 13, Juiz 39, Defensoria 10, Analista 12; contagem aproximada"}},{"t":"Recuperação judicial e falência: créditos da Fazenda","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a recuperação judicial e a falência, Lei 11.101, com as alterações da Lei 14.112. O crédito tributário se sujeita ao plano de recuperação? Não: ele não se submete à recuperação, e a Fazenda não vota na assembleia de credores, artigo 187 do Código Tributário e artigo 6º, parágrafo 7º-B, da lei. Na falência, a ordem de pagamento começa pelos créditos trabalhistas, até cento e cinquenta salários mínimos, e acidentes de trabalho, depois os com garantia real, e só então os tributários, artigo 83. Em prova: se a questão disser que o crédito tributário se sujeita ao plano de recuperação judicial, ou que o crédito tributário tem preferência sobre o trabalhista na falência, está errada. Guarde: tributo fora da recuperação; na falência, trabalhista vem antes. Revise, estudante. Até a próxima lição.","id":"70","q":{"a":"Falência / recuperação","n":38,"d":"MP e ENAM 19, Juiz 18, Defensoria 1, Analista 0; contagem aproximada"}},{"t":"Títulos de crédito: princípios, cheque e prazos","link":"","k":"new","txt":"O estudo de hoje é sobre os títulos de crédito. Quais são os princípios? A cartularidade, a literalidade e a autonomia. Pela autonomia, as exceções pessoais não podem ser opostas ao terceiro de boa-fé, artigo 916 do Código Civil. No cheque, Lei 7.357, o prazo de apresentação é de trinta dias, na mesma praça, e sessenta, em praça diferente. A execução prescreve em seis meses, contados do fim do prazo de apresentação, artigo 59. Perdida a força executiva, cabe ação monitória, em cinco anos, contados do dia seguinte à data de emissão, Súmula 503 do STJ. Em prova: se a questão disser que o cheque prescrito não pode ser cobrado por nenhuma ação, ou que a prescrição da execução é de cinco anos, está errada. Guarde: execução em seis meses; monitória em cinco anos. Revise, estudante. Até a próxima lição.","id":"71","q":{"a":"Títulos de crédito","n":29,"d":"MP e ENAM 4, Juiz 17, Defensoria 1, Analista 7; contagem aproximada"}},{"t":"Propriedade industrial: patentes e marcas","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a propriedade industrial, Lei 9.279. A patente de invenção vigora por vinte anos e a de modelo de utilidade, por quinze, contados do depósito. A invenção exige novidade, atividade inventiva e aplicação industrial. Na ADI 5.529, o Supremo declarou inconstitucional a prorrogação automática do prazo da patente, que estava no parágrafo único do artigo 40. A marca é protegida pelo registro, sistema atributivo, e vale por dez anos, prorrogáveis por períodos iguais e sucessivos. Em prova: se a questão disser que a patente pode ter o prazo prorrogado automaticamente em razão da demora do INPI, ou que a marca se prorroga uma única vez, está errada. Guarde: invenção, vinte anos; modelo de utilidade, quinze; marca, dez anos prorrogáveis. Revise, estudante. Até a próxima lição.","id":"78","q":{"a":"Propriedade industrial","n":8,"d":"MP e ENAM 0, Juiz 6, Defensoria 1, Analista 1; contagem aproximada"}}]},{"tema":"Previdenciário","itens":[{"t":"Regime próprio: caráter contributivo e quem se vincula","link":"","k":"new","txt":"O assunto de hoje é o regime próprio de previdência dos servidores. Quais são as diretrizes? Pelo artigo 40 da Constituição, o regime é de caráter contributivo e solidário, com equilíbrio financeiro e atuarial. A Emenda 103, de 2019, passou a exigir idade mínima fixada na lei do respectivo ente. Quem se vincula? Apenas o servidor ocupante de cargo efetivo. O ocupante exclusivamente de cargo em comissão, de cargo temporário ou de emprego público fica no regime geral, parágrafo 13. É vedada a contagem de tempo de contribuição fictício. Já o abono de permanência é devido a quem, tendo completado os requisitos, permanece em atividade. Em prova: se a questão disser que o servidor ocupante apenas de cargo em comissão é vinculado ao regime próprio, está errada. Guarde: regime próprio, cargo efetivo; comissão e emprego, regime geral. Revise, estudante. Até a próxima lição.","id":"73","q":{"a":"Previdenciário","n":28,"d":"MP e ENAM 0, Juiz 20, Defensoria 1, Analista 7; contagem aproximada"}},{"t":"RGPS: segurados, carência e período de graça","link":"","k":"new","txt":"O tema de hoje é o Regime Geral de Previdência Social, Leis 8.212 e 8.213. São segurados obrigatórios o empregado, o contribuinte individual, o trabalhador avulso, o segurado especial e o doméstico; o facultativo é quem se filia por vontade. A carência é de doze contribuições para o auxílio por incapacidade e de cento e oitenta para a aposentadoria programada, e o salário-maternidade da empregada independe de carência. Mantém a qualidade de segurado, sem contribuir, o desempregado por doze meses após a cessação, prorrogados por mais doze quando há mais de cento e vinte contribuições. O benefício assistencial, LOAS, exige renda per capita inferior a um quarto do salário mínimo. Em prova: se a questão disser que o período de graça é de seis meses para todos, está errada. Guarde: carência, doze e cento e oitenta; graça, doze mais doze. Revise, estudante. Até a próxima lição.","id":"93","q":{"a":"RGPS","n":30,"d":"MP e ENAM 0, Juiz 8, Defensoria 5, Analista 10; contagem aproximada"}}]},{"tema":"Consumidor","itens":[{"t":"CDC: responsabilidade do fornecedor, vícios e práticas abusivas","link":"","k":"new","txt":"A lição de hoje é o Código de Defesa do Consumidor, Lei 8.078. O fornecedor responde objetivamente pelo fato do produto e do serviço, artigos 12 e 14, e só se exime se provar que o defeito não existe ou que houve culpa exclusiva do consumidor ou de terceiro. No vício, o prazo para reclamar é de trinta dias, nos bens não duráveis, e noventa, nos duráveis, artigo 26. A pretensão por acidente de consumo prescreve em cinco anos. São práticas abusivas a venda casada e o envio de produto sem solicitação, que é amostra grátis. As cláusulas abusivas são nulas, artigo 51. Os serviços públicos devem ser adequados, eficientes, seguros e contínuos, artigo 22, mas taxas e serviços gerais, sem remuneração individual, não geram relação de consumo. Em prova: se a questão disser que o CDC não alcança as instituições financeiras, está errada, Súmula 297. Guarde: risco objetivo; trinta e noventa; cinco anos. Revise, estudante. Até a próxima lição.","id":"102","q":{"a":"Consumidor","n":105,"d":"MP e ENAM 12, Juiz 49, Defensoria 32, Analista 3; contagem aproximada"}}]},{"tema":"Penal","itens":[{"t":"Crimes contra o patrimônio: furto, roubo e estelionato","link":"","k":"new","txt":"O assunto de hoje são os crimes contra o patrimônio. O furto, artigo 155, é subtrair coisa alheia móvel, com pena de um a quatro anos; é qualificado, com dois a oito, se houver rompimento de obstáculo ou concurso de pessoas. No roubo, artigo 157, há violência ou grave ameaça, e, pela Súmula 582 do STJ, ele se consuma com a inversão da posse, ainda que breve, sendo desnecessária a posse mansa e pacífica. Não se aplica a insignificância ao roubo, Súmula 442. No latrocínio, Súmula 610 do Supremo, o crime se consuma com a morte, mesmo sem a subtração. A extorsão se consuma independentemente da vantagem, Súmula 96. O estelionato, em regra, depende de representação da vítima. Em prova: se a questão disser que o roubo só se consuma com a posse mansa e pacífica, está errada. Guarde: roubo, inversão da posse; latrocínio, morte; insignificância não cabe. Revise, estudante. Até a próxima lição.","id":"103","q":{"a":"Penal: patrimônio","n":97,"d":"MP e ENAM 18, Juiz 45, Defensoria 24, Analista 6; contagem aproximada"}},{"t":"Abuso de autoridade, tortura e crimes hediondos","link":"","k":"new","txt":"O estudo de hoje são três leis penais especiais. Na Lei 13.869, o abuso de autoridade exige finalidade específica: prejudicar outrem, beneficiar a si ou a terceiro, ou agir por capricho ou satisfação pessoal. A divergência na interpretação da lei ou na avaliação de fatos e provas não configura o crime. A ação é pública, com queixa subsidiária, e há efeitos como indenização e inabilitação para o cargo de um a cinco anos. Na Lei 9.455, a tortura tem pena de dois a oito anos, é inafiançável e insuscetível de graça ou anistia, com perda do cargo e interdição pelo dobro da pena. Na Lei 8.072, os crimes hediondos são rol taxativo, e não admitem anistia, graça, indulto nem fiança. Em prova: se a questão disser que o abuso de autoridade se configura sem dolo específico, está errada. Guarde: dolo específico; divergência de interpretação não é crime. Revise, estudante. Até a próxima lição.","id":"107","q":{"a":"Penal especial","n":39,"d":"MP e ENAM 6, Juiz 12, Defensoria 14, Analista 4; contagem aproximada"}},{"t":"Crimes contra a Administração Pública","link":"","k":"new","txt":"A lição de hoje são os crimes contra a Administração Pública. Funcionário público, para fins penais, é quem exerce cargo, emprego ou função pública, ainda que transitoriamente ou sem remuneração, artigo 327. No peculato, artigo 312, o funcionário se apropria ou desvia bem de que tem a posse em razão do cargo, com pena de dois a doze anos. No peculato culposo, a reparação do dano antes da sentença extingue a punibilidade. A corrupção passiva, artigo 317, é solicitar ou receber vantagem indevida; a ativa, artigo 333, é oferecê-la ou prometê-la. A prevaricação é retardar ou deixar de praticar ato de ofício por interesse pessoal. Pela Súmula 599 do STJ, o princípio da insignificância não se aplica a esses crimes. Em prova: se a questão disser que cabe insignificância no peculato, está errada. Guarde: peculato, posse em razão do cargo; Súmula 599. Revise, estudante. Até a próxima lição.","id":"109","q":{"a":"Penal: Administração Pública","n":25,"d":"MP e ENAM 9, Juiz 8, Defensoria 4, Analista 1; contagem aproximada"}}]}];
const m=document.getElementById('m'),back=document.getElementById('back'),ct=document.getElementById('ct'),bot=document.getElementById('bot');

function applySz(){document.documentElement.style.setProperty('--fs',SZ[si]+'px')}applySz();
document.getElementById('aa').onclick=()=>{si=(si+1)%SZ.length;applySz();try{localStorage.setItem('ipf_sz',si)}catch(e){}};
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const ALL=[];D.forEach(g=>g.itens.forEach(i=>{i.tema=g.tema;ALL.push(i)}));
function home(){
 ct.textContent='Decorando pela Força';back.style.display='none';m.innerHTML='';bot.innerHTML='';
 m.appendChild(el('div','title','<big>IPelaForça</big>'));
 {const q=el('p','sub','Vídeos-aula de jurisprudência: toque no tema e leia o roteiro.');q.style.textAlign='center';m.appendChild(q)}
 D.forEach(g=>{
  const h=el('div','h');h.textContent=g.tema+' ('+g.itens.length+' tópico'+(g.itens.length>1?'s':'')+')';m.appendChild(h);
  const me=el('div','menu');
  g.itens.forEach(i=>{const a=el('a',i.k==='lit'?'':'sv','<span class="s"></span><span class="t"></span>');
   a.querySelector('.s').textContent=g.tema;a.querySelector('.t').textContent=i.t;a.href='#/'+i.id;me.appendChild(a)});
  m.appendChild(me);
 });
}
function topic(id){
 const i=ALL.findIndex(x=>x.id===id);if(i<0)return home();const t=ALL[i];
 back.style.display='';back.href='#/';ct.textContent=t.tema;m.innerHTML='';
 m.appendChild(el('div','h')).textContent=t.tema;
 const s=el('p','sub');s.textContent=t.t;m.appendChild(s);
 if(t.link){const a=el('a','rd','▶ Assistir ao vídeo');a.href=t.link;a.target='_blank';a.rel='noopener';m.appendChild(a)}
 {const p=el('p','nt');p.style.textAlign='left';p.style.margin='0 0 10px';
  p.textContent=t.q?('Questões de concurso na nossa biblioteca sobre este assunto: '+t.q.n+' ('+t.q.a+': '+t.q.d+').'):'Questões de concurso na nossa biblioteca: este tema não tem assunto próprio no ranking (aparece só como subtema de LGPD e LAI, 10 questões).';m.appendChild(p)}
 m.appendChild(el('div','h','Roteiro do vídeo'));
 if(t.k==='non'){const p=el('p','nt');p.textContent='Roteiro literal ainda não disponível neste app.';m.appendChild(p)}
 else{
  if(t.k==='new'){const p=el('p','nt');p.textContent='Roteiro novo (2ª onda), ainda sem vídeo.';m.appendChild(p)}
  if(t.k==='fic'){const p=el('p','nt');p.textContent='Texto da ficha de estudo deste vídeo (sem a abertura e o fecho da narração).';m.appendChild(p)}
  const d=el('div','fala');d.textContent=t.txt;m.appendChild(d);
 }
 const n=el('div','nv');const pr=el('a',i>0?'':'off','‹ Anterior'),ix=el('a','','Temas'),nx=el('a',i<ALL.length-1?'':'off','Próximo ›');
 pr.href=i>0?'#/'+ALL[i-1].id:'#';ix.href='#/';nx.href=i<ALL.length-1?'#/'+ALL[i+1].id:'#';n.append(pr,ix,nx);m.appendChild(n);
 bot.innerHTML='';
}
function route(){const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(s[0])topic(s[0]);else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
