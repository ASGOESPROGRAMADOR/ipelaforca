<style>
:root{--paper:#faf2d6;--ink:#191916;--gold:#fbdd67;--red:#ff0807;--salmon:#fe6e52;--ring:#b78445;--bar2:#191916;--fs:17px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper)}
body{color:var(--ink);font:var(--fs)/1.5 'Noto Serif','Droid Serif',Georgia,serif;padding:48px 0 56px;min-height:100vh}
.top{position:fixed;top:0;left:0;right:0;height:48px;background:#000;color:var(--gold);z-index:10;display:flex;align-items:center;padding:0 14px;font:500 14px Roboto,Arial,sans-serif}
.top a,.top button{color:var(--gold);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
.top .l{display:flex;align-items:center;gap:6px;min-width:90px;font-size:15px}
.top .c{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.top .r{min-width:90px;text-align:right;font-size:19px}
.bot{position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--bar2);display:flex;align-items:center;justify-content:space-around;z-index:10;padding:0 4px;font:500 15px Roboto,Arial,sans-serif}
.bot a{color:var(--gold);text-decoration:none;padding:16px 4px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot a.on{border-top:3px solid var(--gold);padding-top:13px;color:#fff3b3}
.page{max-width:720px;margin:0 auto;padding:10px 16px 90px}
.h{color:var(--red);text-align:center;text-transform:uppercase;margin:24px 0 6px;font-size:1em;letter-spacing:.02em}
.sub{text-align:right;font-style:italic;margin:4px 0 14px}
.rub{color:var(--red);margin:20px 0 4px}
.rub small{display:block;color:var(--salmon);font-size:.95em}
.cross{display:flex;align-items:flex-start;gap:8px;margin:18px 0 10px;font-weight:700}
.cross i{flex:none;width:20px;height:20px;margin-top:3px;border-radius:3px;background:var(--salmon);position:relative}
.cross i:before{content:"";position:absolute;left:8px;top:3px;width:4px;height:14px;background:var(--paper)}
.cross i:after{content:"";position:absolute;left:3px;top:8px;width:14px;height:4px;background:var(--paper)}
.cross span em{font-style:normal;color:var(--salmon);font-weight:400}
.v{position:relative;padding-left:20px;margin:0 0 14px}
.v>sup{position:absolute;left:0;top:.45em;font:400 9px/1 Roboto,Arial,sans-serif;color:var(--salmon)}
.v b{font-weight:700}
.p .v>sup{color:var(--red)}
.p .v:before{content:"R.";color:var(--red);margin-right:6px}
.menu a{display:block;text-decoration:none;color:var(--ink);padding:16px 14px 14px;margin:14px 0;border:2px solid var(--ring);border-radius:12px;background:rgba(255,255,255,.35)}
.menu a:active{background:rgba(183,132,66,.18)}
.menu .t{display:block;color:var(--red);font-size:1.2em;font-weight:700}
.menu .m{display:block;margin-top:4px;font-style:italic;font-size:.92em}
.menu .s{display:block;margin-top:6px;font:400 12px Roboto,sans-serif;color:var(--salmon);text-transform:uppercase;letter-spacing:.06em}
.title{text-align:center;margin:18px 0 4px}
.title big{display:block;color:var(--red);font-size:2em;font-weight:700;line-height:1.1}
.nv{display:flex;gap:10px;margin:26px 0 0}
.nv a{flex:1;text-align:center;text-decoration:none;color:var(--gold);background:#000;border-radius:10px;padding:12px 6px;font:500 15px Roboto,Arial,sans-serif}
.nv a.off{opacity:.3;pointer-events:none}
.menu a.sv{background:#dcefc9;border-color:#6f9f4c}
.menu a.sv:active{background:#c9e4ae}
.menu a.off{opacity:.55;pointer-events:none}
.rd{display:block;text-align:center;text-decoration:none;color:var(--gold);background:#000;border-radius:10px;padding:12px 6px;margin:6px 0 18px;font:500 15px Roboto,Arial,sans-serif}
.nt{font:400 13px/1.4 Roboto,Arial,sans-serif;color:var(--salmon);text-align:center;margin:6px 0 16px}
.fala{margin:0 0 14px}
</style></head><body>

<script>
const D=[{"tema":"Administrativo","itens":[{"t":"Poder de polícia: lição no deserto","link":"https://drive.google.com/file/d/1NKIGIu0HznDZ3QeU5C88BuwqOG6JVzjJ/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é o poder de polícia. Guarde o conceito: é a atividade da Administração que limita ou disciplina direito, interesse ou liberdade, em razão do interesse público. Está no artigo 78 do Código Tributário Nacional. Será regular quando exercido pelo órgão competente, nos limites da lei, com processo legal e sem abuso ou desvio de poder. Três atributos: discricionariedade, autoexecutoriedade e coercibilidade. Atenção, a banca adora isto: a multa não é autoexecutória, precisa de execução fiscal. O poder de polícia também gera taxa, mas só pelo exercício regular. Não basta o órgão existir no papel. A taxa não pode ter base de cálculo idêntica à de imposto. Limites: legalidade, proporcionalidade, devido processo e finalidade pública. Revise, estudante. Até a próxima lição.","id":"1","q":null},{"t":"Improbidade: acordo de não persecução cível","link":"https://drive.google.com/file/d/1VbwjXtIqVSFm1BQebZt7pFykx4YUj-_E/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é improbidade: acordo de não persecução cível. Quem pode fazer acordo em improbidade? O acordo de não persecução cível, o ANPC, funciona assim: em vez de seguir com o processo até o fim, o agente devolve o dinheiro, perde a vantagem indevida e aceita as sanções, e a Justiça homologa. A lei nova dizia que só o Ministério Público podia propor. O Supremo corrigiu isso nas ADIs 7042 e 7043. A legitimidade é concorrente, ou seja, os dois podem, e disjuntiva, ou seja, um não precisa do outro. Então o município lesado, pela procuradoria, também pode propor a ação e fazer o acordo. Em prova: se a questão disser que só o Ministério Público pode, está errada. Guarde: Ministério Público e ente lesado, os dois. Revise, estudante. Até a próxima lição.","id":"2","q":{"a":"Improbidade administrativa","n":58,"d":"MP e ENAM 30, Juiz 17, Defensoria 3, Analista 8; contagem aproximada"}},{"t":"Improbidade: dolo e lei nova (Tema 1.199)","link":"https://drive.google.com/file/d/1GQ6CGpBWh4v91NYtth5tWbM7wGFJjCiX/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é improbidade: dolo e lei nova. Improbidade: o que a lei nova mudou? Antes, até a culpa podia gerar improbidade. A lei nova passou a exigir dolo, a vontade de lesar, e fixou prescrição de oito anos, com intercorrente de quatro. No Tema 1.199, o Supremo decidiu três coisas. Primeira: sem dolo não há improbidade, e isso alcança os processos ainda sem trânsito em julgado. Segunda: a coisa julgada já formada não é desfeita. Terceira: o novo prazo de prescrição não retroage. Em prova: se a questão disser que a lei nova desfaz condenações definitivas, ou que o novo prazo retroage, está errada. Guarde: dolo sempre; coisa julgada fica; prazo novo só para frente. Revise, estudante. Até a próxima lição.","id":"3","q":{"a":"Improbidade administrativa","n":58,"d":"MP e ENAM 30, Juiz 17, Defensoria 3, Analista 8; contagem aproximada"}},{"t":"Responsabilidade do agente: dupla garantia (Tema 940)","link":"https://drive.google.com/file/d/1SRiC79m70Em5EUGN6XaQdBBgWZEmW-Se/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é responsabilidade do agente público, a dupla garantia. Um servidor causa dano a alguém. Quem a vítima processa? O artigo 37, parágrafo 6º, da Constituição prevê a responsabilidade objetiva do Estado pelos danos que seus agentes causam. No Tema 940, o Supremo firmou a dupla garantia. A ação por dano causado por agente público deve ser proposta contra o Estado, e o agente não é parte legítima nessa ação. Em contrapartida, o Estado tem direito de regresso contra o agente, desde que haja dolo ou culpa. Em prova: se a questão disser que a vítima pode escolher processar diretamente o servidor, está errada, segundo esse tema. Guarde: a vítima processa o Estado; o Estado cobra do agente, se houve dolo ou culpa. Revise, estudante. Até a próxima lição.","id":"4","q":{"a":"Responsabilidade civil do Estado","n":16,"d":"MP e ENAM 7, Juiz 5, Defensoria 3, Analista 1; contagem aproximada"}},{"t":"Concurso: o Judiciário não refaz a correção (Tema 485)","link":"https://drive.google.com/file/d/1_eDNOM28xQd-pUIKrTYaHYX0SplTO9Pf/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é concurso público e correção de prova. O Judiciário pode corrigir a prova de um candidato? No Tema 485, o Supremo decidiu que não compete ao Judiciário substituir a banca examinadora para reavaliar as respostas e as notas atribuídas. O controle judicial é de legalidade: o juiz verifica se o edital e a Constituição foram respeitados, mas não refaz o mérito da correção. Questão fora do conteúdo previsto no edital, por exemplo, pode ser anulada. Em prova: se a questão disser que o juiz pode refazer a correção por discordar do critério, está errada. Guarde: o Judiciário confere a legalidade, não refaz a nota. Revise, estudante. Até a próxima lição.","id":"5","q":{"a":"Servidores e agentes públicos","n":59,"d":"MP e ENAM 12, Juiz 17, Defensoria 6, Analista 24; contagem aproximada"}},{"t":"Improbidade: ressarcimento ao erário, prescreve ou não? (Temas 897, 899 e 666)","link":"","k":"new","txt":"O assunto de hoje é o ressarcimento ao erário: prescreve ou não? Devolver o dinheiro público prescreve? Depende da origem do prejuízo. O artigo 37, parágrafo 5º, da Constituição ressalva as ações de ressarcimento. No Tema 897, o Supremo decidiu que é imprescritível a ação de ressarcimento fundada em ato doloso de improbidade. No Tema 899, que prescreve o ressarcimento fundado apenas em decisão de Tribunal de Contas, pois ele não decide sobre dolo de improbidade. E no Tema 666, que prescreve a reparação de dano à Fazenda por ilícito civil. Em prova: se a questão disser que todo ressarcimento ao erário é imprescritível, está errada. Guarde: dolo de improbidade, nunca prescreve; Tribunal de Contas e ilícito civil, prescrevem. Revise, estudante. Até a próxima lição.","id":"14","q":{"a":"Improbidade administrativa","n":58,"d":"MP e ENAM 30, Juiz 17, Defensoria 3, Analista 8; contagem aproximada"}},{"t":"Greve de servidores públicos (Tema 531)","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a greve dos servidores públicos. Servidor em greve perde os dias parados? O artigo 37, inciso VII, da Constituição garante o direito de greve, mas a lei específica ainda não foi editada. Enquanto isso, aplica-se a Lei 7.783, com adaptações. No Tema 531, o Supremo decidiu que a Administração deve descontar os dias parados, pois a greve suspende o vínculo funcional. A compensação é possível por acordo. Mas o desconto é incabível se a greve foi provocada por conduta ilícita do Poder Público. Em prova: se a questão disser que a Administração não pode descontar os dias de greve, ou que o desconto vale mesmo diante de conduta ilícita do Poder Público, está errada. Guarde: greve comum, desconto devido; conduta ilícita do Poder Público, sem desconto. Revise, estudante. Até a próxima lição.","id":"16","q":{"a":"Servidores e agentes públicos","n":59,"d":"MP e ENAM 12, Juiz 17, Defensoria 6, Analista 24; contagem aproximada"}},{"t":"PAD e absolvição criminal (Súmulas 18 STF, 650 e 651 STJ)","link":"","k":"new","txt":"O assunto de hoje é o processo administrativo disciplinar e a esfera penal. A absolvição criminal livra o servidor da demissão? Depende do motivo. Pela Súmula 18 do Supremo, a falta residual, não compreendida na absolvição criminal, pode ser punida administrativamente. A absolvição só vincula a Administração se reconhecer a inexistência do fato ou a negativa de autoria. Na Súmula 650, o STJ firmou que, caracterizadas as hipóteses do artigo 132 da Lei 8.112, a autoridade não pode aplicar pena menos gravosa que a demissão. E na Súmula 651, que a demissão por improbidade independe de prévia condenação judicial à perda da função. Em prova: se a questão disser que toda absolvição penal impede a punição administrativa, está errada. Guarde: inexistência do fato ou negativa de autoria, vincula; falta residual, pode punir. Revise, estudante. Até a próxima lição.","id":"17","q":{"a":"Servidores e agentes públicos","n":59,"d":"MP e ENAM 12, Juiz 17, Defensoria 6, Analista 24; contagem aproximada"}},{"t":"Nepotismo (Súmula Vinculante 13)","link":"","k":"new","txt":"O estudo de hoje é sobre o nepotismo na Administração Pública. Nomear parente para cargo em comissão pode? A Súmula Vinculante 13 proíbe a nomeação de cônjuge, companheiro ou parente até o terceiro grau da autoridade nomeante, ou de servidor investido em cargo de direção, chefia ou assessoramento. Inclui o nepotismo cruzado, com designações recíprocas. A vedação decorre direto dos princípios do artigo 37 da Constituição e não depende de lei formal. Atenção: em regra, não alcança cargos políticos, como o de secretário, salvo fraude ou inaptidão manifesta. Em prova: se a questão disser que a vedação só vale com lei do ente, ou que alcança sempre os cargos políticos, está errada. Guarde: até o terceiro grau; sem exigir lei; cargo político, em regra, fora. Revise, estudante. Até a próxima lição.","id":"18","q":{"a":"Servidores e agentes públicos","n":59,"d":"MP e ENAM 12, Juiz 17, Defensoria 6, Analista 24; contagem aproximada"}},{"t":"Teto e honorários dos procuradores municipais (Tema 510)","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre o teto remuneratório dos procuradores municipais. Qual é o teto: o subsídio do Prefeito ou o dos Ministros do Supremo? No Tema 510, o Supremo decidiu que os procuradores municipais estão incluídos na expressão Procuradores do artigo 37, inciso XI, da Constituição. Por isso, o teto deles é de 90,25% do subsídio dos Ministros do Supremo, e não o subsídio do Prefeito. E os honorários de sucumbência? Na ADI 6.053, o Supremo declarou constitucional o pagamento aos advogados públicos, mas sujeito ao teto constitucional. Em prova: se a questão disser que o teto do procurador municipal é o subsídio do Prefeito, ou que os honorários ficam fora do teto, está errada. Guarde: Ministro do Supremo, 90,25%; honorários, dentro do teto. Revise, estudante. Até a próxima lição.","id":"19","q":{"a":"Servidores e agentes públicos","n":59,"d":"MP e ENAM 12, Juiz 17, Defensoria 6, Analista 24; contagem aproximada"}},{"t":"Licitações: Lei 14.133 e as modalidades","link":"","k":"new","txt":"O estudo de hoje é sobre a Lei de Licitações. Quais são as modalidades na Lei 14.133, de 2021? Pelo artigo 28: pregão, concorrência, concurso, leilão e diálogo competitivo. Convite e tomada de preços deixaram de existir. A Lei 8.666 foi revogada, e o regime atual é o da Lei 14.133. O pregão é obrigatório para bens e serviços comuns, mas não serve para serviços técnicos especializados de natureza predominantemente intelectual. A contratação direta ocorre por dispensa, artigo 75, em rol taxativo, ou por inexigibilidade, artigo 74, quando a competição é inviável, em rol exemplificativo. Em prova: se a questão disser que convite e tomada de preços continuam como modalidades na Lei 14.133, ou que o rol de inexigibilidade é taxativo, está errada. Guarde: cinco modalidades; dispensa taxativa, inexigibilidade exemplificativa. Revise, estudante. Até a próxima lição.","id":"22","q":{"a":"Licitações","n":65,"d":"MP e ENAM 15, Juiz 28, Defensoria 6, Analista 16; contagem aproximada"}},{"t":"Atos administrativos: autotutela, decadência e contraditório","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a anulação dos atos administrativos. A Administração pode anular seus próprios atos? Pela Súmula 473 do Supremo, sim, por ilegalidade, e pode revogá-los por conveniência e oportunidade, respeitados os direitos adquiridos. Mas o contraditório é exigido: o Supremo decidiu que, se a anulação repercutir sobre o interesse do administrado, é preciso processo com defesa. O prazo para anular ato favorável é de cinco anos, artigo 54 da Lei 9.784, salvo má-fé. E, pela Súmula 633 do STJ, essa lei se aplica a Estados e Municípios, se não houver norma local. Em prova: se a questão disser que a Administração anula ato favorável sem ouvir o interessado, ou a qualquer tempo, está errada. Guarde: autotutela sim, com contraditório e em cinco anos. Revise, estudante. Até a próxima lição.","id":"26","q":{"a":"Atos e processo administrativo","n":48,"d":"MP e ENAM 6, Juiz 19, Defensoria 12, Analista 11; contagem aproximada"}},{"t":"Organização administrativa: autarquias e estatais","link":"","k":"new","txt":"O estudo de hoje é sobre a organização administrativa. Como se cria cada entidade? Pelo artigo 37, inciso XIX, da Constituição, somente por lei específica se cria autarquia, e se autoriza a criação de empresa pública, sociedade de economia mista e fundação. A criação de subsidiárias também depende de autorização legislativa, inciso XX. A autarquia tem personalidade de direito público. As empresas estatais que exploram atividade econômica seguem o regime das empresas privadas, artigo 173, parágrafo 1º, e não gozam de privilégios não extensivos ao setor privado, parágrafo 2º. Em prova: se a questão disser que a autarquia é autorizada por lei e depois registrada, ou que as estatais econômicas têm privilégios fiscais, está errada. Guarde: lei cria autarquia; lei autoriza as demais e as subsidiárias. Revise, estudante. Até a próxima lição.","id":"32","q":{"a":"Organização administrativa e estatais","n":35,"d":"MP e ENAM 10, Juiz 14, Defensoria 3, Analista 8; contagem aproximada"}},{"t":"Bens públicos e serviços públicos","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre os bens públicos e os serviços públicos. Quem ocupa bem público tem direito a indenização? Pela Súmula 619 do STJ, a ocupação indevida configura mera detenção, sem efeito possessório e sem direito a indenização por benfeitorias. Os bens públicos são inalienáveis enquanto afetados, impenhoráveis e não admitem usucapião, artigo 102 do Código Civil e Súmula 340 do Supremo. Quanto aos serviços, a Lei 8.987 exige serviço adequado, com continuidade, e permite o corte por inadimplemento, depois de aviso prévio, artigo 6º, parágrafo 3º. Em prova: se a questão disser que bem público dominical pode ser usucapido, ou que o ocupante tem direito de retenção por benfeitorias, está errada. Guarde: bem público, sem usucapião; ocupação é detenção. Revise, estudante. Até a próxima lição.","id":"34","q":{"a":"Bens públicos e serviços públicos","n":33,"d":"MP e ENAM 0, Juiz 18, Defensoria 8, Analista 7; contagem aproximada"}},{"t":"Contas do Prefeito: Câmara, Tribunal de Contas e ADPF 982","link":"","k":"new","txt":"O assunto de hoje é o controle das contas do Prefeito. Quem julga? Depende da natureza. As contas de governo são julgadas pela Câmara Municipal, com parecer prévio do Tribunal de Contas, que só deixa de prevalecer por decisão de dois terços dos vereadores, artigo 31, parágrafo 2º. Já as contas de gestão, quando o Prefeito atua como ordenador de despesas, são julgadas pelo Tribunal de Contas, que pode imputar débito e multa sem ratificação da Câmara. Esse foi o entendimento do Supremo na ADPF 982, em 2025. Para fins de inelegibilidade, o Tema 835 mantém a competência da Câmara. Em prova: se a questão disser que o parecer prévio vincula a Câmara, ou que o Tribunal de Contas não pode multar o Prefeito ordenador de despesas, está errada. Guarde: governo, Câmara; gestão, Tribunal de Contas. Revise, estudante. Até a próxima lição.","id":"42","q":{"a":"Controle da Administração e Tribunais de Contas","n":30,"d":"MP e ENAM 9, Juiz 13, Defensoria 1, Analista 7; contagem aproximada"}},{"t":"Desapropriação: indenização, juros compensatórios e desapropriação indireta","link":"","k":"new","txt":"O assunto de hoje é a intervenção do Estado na propriedade. A regra da desapropriação é a indenização prévia, justa e em dinheiro, artigo 5º, inciso XXIV. As exceções são a desapropriação urbanística, paga em títulos da dívida pública, artigo 182, e a da reforma agrária, em títulos da dívida agrária, artigo 184. A Súmula 618 do Supremo fixa os juros compensatórios em doze por cento ao ano, e o STJ decidiu, no Tema 1.019, que a ação de desapropriação indireta prescreve em dez anos, conforme os prazos da usucapião. Já limitação administrativa, tombamento e servidão são intervenções restritivas, que só geram indenização se houver prejuízo ao proprietário. Em prova: se a questão disser que a desapropriação urbanística é paga em dinheiro, ou que a indireta prescreve em cinco anos, está errada. Guarde: regra, dinheiro; exceções, títulos. Revise, estudante. Até a próxima lição.","id":"46","q":{"a":"Intervenção do Estado na propriedade","n":27,"d":"MP e ENAM 10, Juiz 15, Defensoria 1, Analista 1; contagem aproximada"}},{"t":"Contratos administrativos: prerrogativas, vigência e sanções","link":"","k":"new","txt":"O estudo de hoje é sobre os contratos administrativos na Lei 14.133. A Administração pode alterar o contrato unilateralmente? Sim, para melhor adequação às finalidades de interesse público, respeitados os direitos do contratado, artigo 124. O acréscimo ou a supressão tem limite de vinte e cinco por cento do valor inicial, e de cinquenta por cento no acréscimo de reforma de edifício ou equipamento, artigo 125. Serviços contínuos duram até cinco anos, prorrogáveis até dez. As sanções, artigo 156, são advertência, multa, impedimento de licitar e contratar, e declaração de inidoneidade. Em prova: se a questão disser que a alteração unilateral dispensa o equilíbrio econômico-financeiro, ou que a Administração pode suprimir sem limite, está errada. Guarde: alteração unilateral, até vinte e cinco por cento; equilíbrio sempre mantido. Revise, estudante. Até a próxima lição.","id":"52","q":{"a":"Contratos administrativos","n":22,"d":"MP e ENAM 10, Juiz 3, Defensoria 3, Analista 6; contagem aproximada"}},{"t":"LGPD e governo digital na Administração Pública","link":"","k":"new","txt":"O estudo de hoje é sobre a proteção de dados no Poder Público. A Administração precisa do consentimento do titular para tratar dados? Em regra, não. Pela Lei Geral de Proteção de Dados, artigo 23, o tratamento pelo poder público é feito para atender sua finalidade pública, na persecução do interesse público, com a execução de competências legais ou o cumprimento de atribuições legais, e é preciso informar as hipóteses de tratamento, com transparência. Deve ser indicado um encarregado. O compartilhamento de dados entre órgãos exige finalidade específica e respeito aos princípios da lei, artigos 26 e 27. A Lei 14.129, de 2021, trata do governo digital. Em prova: se a questão disser que o poder público só trata dados com consentimento do titular, está errada. Guarde: poder público trata dados para sua finalidade pública, com transparência. Revise, estudante. Até a próxima lição.","id":"59","q":{"a":"Proteção de dados, governo digital e IA","n":17,"d":"MP e ENAM 10, Juiz 6, Defensoria 1, Analista 0; contagem aproximada"}},{"t":"Direito administrativo sancionador: princípios e prescrição","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre o direito administrativo sancionador. Quais princípios limitam o poder de punir? Legalidade e tipicidade, culpabilidade, proporcionalidade, motivação, contraditório e ampla defesa, e o non bis in idem. Quanto à prescrição, a Lei 9.873, de 1999, na esfera federal, fixa cinco anos para a pretensão punitiva, e prevê a prescrição intercorrente de três anos, se o processo ficar paralisado pendente de julgamento ou despacho. No Município, vale a lei local, e, na falta dela, o STJ aplica o prazo de cinco anos. Em prova: se a questão disser que a Administração pode punir sem tipificação prévia, ou que a prescrição intercorrente é de cinco anos na lei federal, está errada. Guarde: punir exige tipo e processo; paralisação por três anos prescreve. Revise, estudante. Até a próxima lição.","id":"60","q":{"a":"Direito Administrativo sancionador","n":15,"d":"MP e ENAM 0, Juiz 11, Defensoria 3, Analista 1; contagem aproximada"}},{"t":"Lei Anticorrupção: responsabilidade objetiva e leniência","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a Lei Anticorrupção, Lei 12.846, de 2013. A pessoa jurídica responde pelos atos lesivos contra a Administração. Precisa ter culpa? Não: a responsabilidade administrativa e civil da pessoa jurídica é objetiva, artigo 2º. A responsabilização da empresa não exclui a das pessoas físicas, dirigentes e administradores, na medida de sua culpabilidade, artigo 3º. A multa vai de zero vírgula um a vinte por cento do faturamento bruto do último exercício, e nunca é inferior à vantagem auferida, artigo 6º. O acordo de leniência pode reduzir a multa em até dois terços. A prescrição é de cinco anos, artigo 25. Em prova: se a questão disser que a responsabilidade da pessoa jurídica depende de dolo ou culpa, está errada. Guarde: empresa, responsabilidade objetiva; dirigente, na medida da culpa. Revise, estudante. Até a próxima lição.","id":"62","q":{"a":"Lei Anticorrupção","n":13,"d":"MP e ENAM 4, Juiz 7, Defensoria 1, Analista 1; contagem aproximada"}},{"t":"Terceiro setor: organizações sociais, OSCIP e a Lei 13.019","link":"","k":"new","txt":"O assunto de hoje é o terceiro setor. As organizações sociais, Lei 9.637, firmam contrato de gestão com o Poder Público, e no julgamento da ADI 1.923 o Supremo decidiu que o modelo é constitucional, mas a escolha deve seguir critérios objetivos, impessoais e públicos. As OSCIPs, Lei 9.790, firmam termo de parceria. A Lei 13.019, de 2014, regula as parcerias com as organizações da sociedade civil, por três instrumentos: o termo de colaboração, o termo de fomento e o acordo de cooperação. Em regra, o chamamento público é obrigatório. Em prova: se a questão disser que a Administração pode escolher a organização social livremente, sem critério objetivo, está errada. Guarde: terceiro setor, parceria com seleção objetiva e prestação de contas. Revise, estudante. Até a próxima lição.","id":"68","q":{"a":"Terceiro setor","n":8,"d":"MP e ENAM 4, Juiz 2, Defensoria 2, Analista 0; contagem aproximada"}},{"t":"LINDB: Lei 13.655 e a decisão no direito público","link":"","k":"new","txt":"O assunto de hoje é a Lei de Introdução, com as alterações da Lei 13.655, de 2018. Como decidir no direito público? Pelo artigo 20, ninguém decide com base em valores jurídicos abstratos sem considerar as consequências práticas da decisão. Pelo artigo 21, a decisão que invalidar ato, contrato ou processo deve indicar as consequências jurídicas e administrativas e, se for o caso, as condições para a regularização, de modo proporcional. E, pelo artigo 28, o agente público só responde pessoalmente por suas decisões ou opiniões técnicas em caso de dolo ou erro grosseiro. Em prova: se a questão disser que o agente responde por simples culpa leve pelas decisões que tomar, está errada. Guarde: decisão pública considera consequências; agente, só dolo ou erro grosseiro. Revise, estudante. Até a próxima lição.","id":"69","q":{"a":"LINDB","n":7,"d":"MP e ENAM 4, Juiz 2, Defensoria 0, Analista 1; contagem aproximada"}},{"t":"Servidores públicos: concurso, estabilidade e acumulação","link":"","k":"new","txt":"A lição de hoje trata do regime dos servidores. A investidura em cargo ou emprego depende de concurso, e a validade é de até dois anos, prorrogável uma vez por igual período, artigo 37. A estabilidade vem após três anos de efetivo exercício e avaliação especial de desempenho, artigo 41, e só se perde por sentença transitada em julgado, processo administrativo com ampla defesa ou avaliação periódica. A acumulação é vedada, salvo dois cargos de professor, um de professor com outro técnico ou científico, ou dois de profissionais de saúde, desde que haja compatibilidade de horários. O teto é aplicado a cada cargo isoladamente. Em prova: se a questão disser que o estável só perde o cargo por decisão judicial, ou que a acumulação de qualquer dois cargos é livre, está errada. Guarde: concurso, dois anos; estabilidade, três; acumulação, só as exceções. Revise, estudante. Até a próxima lição.","id":"80","q":{"a":"Servidores públicos","n":77,"d":"MP e ENAM 0, Juiz 24, Defensoria 8, Analista 42; contagem aproximada"}},{"t":"Concessões, permissões e PPP","link":"","k":"new","txt":"O assunto de hoje são as concessões, permissões e parcerias público-privadas. A concessão de serviço público, Lei 8.987, exige licitação, na modalidade concorrência ou diálogo competitivo, e é feita por pessoa jurídica ou consórcio que assume o risco por sua conta. A permissão é contrato de adesão, precário e revogável. O poder concedente pode encampar o serviço, mediante lei autorizativa e prévia indenização, ou declarar a caducidade por inadimplemento. Ao final, os bens reversíveis voltam ao poder concedente. Na PPP, Lei 11.079, há a modalidade patrocinada e a administrativa; o contrato não pode ter valor inferior a dez milhões de reais nem prazo menor que cinco anos, nem maior que trinta e cinco. Em prova: se a questão disser que a encampação independe de indenização prévia, está errada. Guarde: encampação, lei e indenização prévia; PPP, dez milhões. Revise, estudante. Até a próxima lição.","id":"96","q":{"a":"Concessões e PPP","n":20,"d":"MP e ENAM 0, Juiz 11, Defensoria 4, Analista 3; contagem aproximada"}},{"t":"Responsabilidade civil do Estado","link":"","k":"new","txt":"A lição de hoje trata da responsabilidade civil do Estado. Pelo artigo 37, parágrafo 6º, as pessoas jurídicas de direito público e as de direito privado prestadoras de serviço público respondem objetivamente pelos danos que seus agentes causarem, assegurado o direito de regresso contra o agente, nos casos de dolo ou culpa. Adota-se a teoria do risco administrativo, que admite excludentes: culpa exclusiva da vítima, caso fortuito e força maior. Na omissão específica, quando o Estado tinha o dever de agir, a responsabilidade também é objetiva; é o caso do preso morto sob custódia, Tema 592 do Supremo. Pelo Tema 940, a vítima deve acionar o Estado, e não diretamente o agente. A prescrição é de cinco anos, Decreto 20.910. Em prova: se a questão disser que a vítima pode processar diretamente o agente, está errada. Guarde: objetiva, risco administrativo; Tema 940; cinco anos. Revise, estudante. Até a próxima lição.","id":"98","q":{"a":"Responsabilidade civil do Estado","n":11,"d":"MP e ENAM 0, Juiz 6, Defensoria 4, Analista 0; contagem aproximada"}},{"t":"Tombamento e outras intervenções na propriedade","link":"","k":"new","txt":"Hoje o tema é a intervenção na propriedade, além da desapropriação. O tombamento, Decreto-Lei 25, protege bens de valor histórico, artístico, cultural ou paisagístico, e todos os entes federados podem instituí-lo. Pode ser voluntário ou compulsório, provisório ou definitivo, e se registra no Livro do Tombo. O proprietário não pode destruir, demolir ou mutilar o bem, e deve conservá-lo; em regra, não há indenização, salvo se o tombamento esvaziar o conteúdo econômico do bem. A servidão administrativa recai sobre imóvel em favor de serviço ou obra pública. Na requisição, em iminente perigo público, a indenização é posterior e só se houver dano. A ocupação temporária recai sobre terreno não edificado, para obras públicas. Em prova: se a questão disser que o tombamento sempre gera dever de indenizar, está errada. Guarde: tombamento, em regra sem indenização; requisição, perigo iminente. Revise, estudante. Até a próxima lição.","id":"101","q":{"a":"Tombamento e intervenção","n":7,"d":"MP e ENAM 0, Juiz 4, Defensoria 0, Analista 1; contagem aproximada"}}]},{"tema":"Constitucional","itens":[{"t":"Controle difuso: art. 52, X, e reserva de plenário","link":"https://drive.google.com/file/d/1SF1Y2DpVRmTswk7eKAVwYVJr7qDwZvyW/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é controle difuso e reserva de plenário. No controle difuso, qualquer juiz pode deixar de aplicar uma lei inconstitucional, mas só no caso concreto. Para valer para todos, o Senado suspende a lei, artigo 52, inciso X. Nas ADIs 3406 e 3470, o Supremo sinalizou efeito amplo sem o Senado, a abstrativização. Já a Súmula Vinculante 10 diz: tribunal só afasta lei por maioria absoluta do plenário ou do órgão especial. Se uma turma afasta a lei sem declarar a inconstitucionalidade, viola a reserva de plenário. Em prova: a resolução do Senado continua no texto, e a SV 10 não alcança o juiz de primeiro grau nem as turmas recursais. Guarde: tribunal, só por plenário; juiz singular, não. Revise, estudante. Até a próxima lição.","id":"6","q":{"a":"Controle de constitucionalidade","n":39,"d":"MP e ENAM 19, Juiz 10, Defensoria 10, Analista 0; contagem aproximada"}},{"t":"Ação civil pública: coisa julgada sem limite territorial (Tema 1.075)","link":"","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é ação civil pública e coisa julgada. Ação civil pública protege direitos coletivos. A lei dizia que a coisa julgada nela só valia dentro da competência territorial do juiz que decidiu. Isso limitava muito o alcance das decisões. No Tema 1.075, o Supremo declarou inconstitucional essa limitação territorial do artigo 16 da Lei 7.347. A coisa julgada na ação civil pública é erga omnes: vale para todos os beneficiados, sem fronteira de comarca. Em prova: se a questão disser que a coisa julgada fica restrita ao território do juiz que decidiu, está errada. Guarde: efeito erga omnes, sem limite territorial. Revise, estudante. Até a próxima lição.","id":"7","q":{"a":"Ação civil pública","n":63,"d":"MP e ENAM 20, Juiz 21, Defensoria 15, Analista 7; contagem aproximada"}},{"t":"Mínimo existencial e reserva do possível","link":"","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é mínimo existencial e reserva do possível. Reserva do possível é o argumento de que o Estado não tem dinheiro para cumprir um direito. Mínimo existencial é o núcleo de condições básicas de vida digna, que o Estado precisa garantir sempre. Na ADPF 45, o Supremo firmou que a reserva do possível não pode esvaziar o mínimo existencial. No Tema 220, decidiu que o Judiciário pode determinar obras emergenciais em presídios. No Tema 698, que pode intervir em política pública diante de grave deficiência de direitos fundamentais, mas, como regra, define objetivos e exige da Administração um plano. Em prova: se a questão disser que a separação dos Poderes impede qualquer ordem judicial, está errada. Guarde: o mínimo existencial vence a reserva do possível. Revise, estudante. Até a próxima lição.","id":"8","q":{"a":"Políticas públicas e processo estrutural","n":31,"d":"MP e ENAM 9, Juiz 12, Defensoria 10, Analista 0; contagem aproximada"}},{"t":"Saúde: quem responde e remédio sem registro","link":"https://drive.google.com/file/d/1z44P4uvO4lRAmchWwf07l-2YXEF3Vr7U/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é saúde: quem responde e remédio sem registro. Quem paga um tratamento de saúde: União, Estado ou Município? No Tema 793, o Supremo disse que os entes federados são solidariamente responsáveis. O paciente pode acionar qualquer um. Mas o juiz pode direcionar o cumprimento a quem tem a atribuição e determinar o ressarcimento entre os entes. Já para remédio sem registro na Anvisa, no Tema 500, a regra é a vedação, e a competência é da Justiça Federal. A exceção é a demora irrazoável da Anvisa em decidir o pedido de registro. Em prova: solidariedade não impede o juiz de organizar quem cumpre e quem ressarce. Guarde: solidariedade, com direcionamento; sem registro, em regra, não. Revise, estudante. Até a próxima lição.","id":"9","q":{"a":"Saúde, saúde mental e educação","n":30,"d":"MP e ENAM 9, Juiz 12, Defensoria 9, Analista 0; contagem aproximada"}},{"t":"Organização dos Poderes: imunidades e CPI","link":"","k":"new","txt":"O assunto de hoje é a organização dos Poderes, com foco no Legislativo. Qual é o alcance da imunidade parlamentar? Pelo artigo 53 da Constituição, deputados e senadores são invioláveis, civil e penalmente, por suas opiniões, palavras e votos. Quanto à prisão, só em flagrante de crime inafiançável, e a Casa decide em vinte e quatro horas se mantém a prisão. As Comissões Parlamentares de Inquérito, pelo artigo 58, parágrafo 3º, têm poderes de investigação próprios das autoridades judiciais, mas não podem decretar prisão, salvo em flagrante, nem busca domiciliar, nem interceptação telefônica, que dependem de ordem judicial. Em prova: se a questão disser que a CPI pode decretar a prisão preventiva ou autorizar interceptação telefônica, está errada. Guarde: CPI investiga, mas a reserva de jurisdição continua com o juiz. Revise, estudante. Até a próxima lição.","id":"23","q":{"a":"Organização dos Poderes","n":69,"d":"MP e ENAM 12, Juiz 32, Defensoria 18, Analista 7; contagem aproximada"}},{"t":"Direitos fundamentais: eficácia, tratados e limites","link":"","k":"new","txt":"O estudo de hoje é sobre os direitos fundamentais. Qual é a eficácia deles? Pelo artigo 5º, parágrafo 1º, as normas definidoras têm aplicação imediata. Eles são cláusulas pétreas, artigo 60, parágrafo 4º, inciso IV, e não são absolutos: sofrem limites pela proporcionalidade, quando colidem. Os tratados de direitos humanos aprovados em dois turnos, por três quintos, equivalem a emenda constitucional, artigo 5º, parágrafo 3º. Sem esse rito, têm status supralegal, como decidiu o Supremo ao afastar a prisão do depositário infiel, Súmula Vinculante 25. Em prova: se a questão disser que tratado de direitos humanos sem o rito especial tem status de emenda, ou que direito fundamental é absoluto, está errada. Guarde: rito de emenda, nível constitucional; sem rito, supralegal. Revise, estudante. Até a próxima lição.","id":"28","q":{"a":"Direitos fundamentais","n":48,"d":"MP e ENAM 17, Juiz 15, Defensoria 13, Analista 3; contagem aproximada"}},{"t":"Processo legislativo: iniciativa reservada (Tema 917)","link":"","k":"new","txt":"O estudo de hoje é sobre a iniciativa no processo legislativo municipal. Vereador pode propor lei que cria despesa? O artigo 61, parágrafo 1º, da Constituição reserva ao Chefe do Executivo a iniciativa de leis sobre a estrutura e as atribuições de órgãos da Administração e sobre o regime jurídico dos servidores, e essa regra vale para Estados e Municípios por simetria. No Tema 917, o Supremo decidiu que a lei de iniciativa parlamentar que não trate da estrutura ou da atribuição de órgãos do Executivo, nem do regime de servidores, não tem vício de iniciativa, ainda que crie despesa para o Município. Em prova: se a questão disser que toda lei de iniciativa parlamentar que gere despesa é inconstitucional, está errada. Guarde: o vício está na matéria reservada, não no mero impacto financeiro. Revise, estudante. Até a próxima lição.","id":"40","q":{"a":"Processo legislativo e iniciativa","n":34,"d":"MP e ENAM 9, Juiz 14, Defensoria 9, Analista 2; contagem aproximada"}},{"t":"Teoria da Constituição: eficácia, recepção e poder constituinte","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a teoria da Constituição. Qual é a eficácia das normas? As de eficácia plena produzem todos os efeitos desde a promulgação, as de eficácia contida podem ser restringidas pela lei, e as de eficácia limitada dependem de lei para produzir plenos efeitos. Sobre o direito anterior, a norma compatível com a nova Constituição é recebida, e a incompatível é revogada: não existe inconstitucionalidade superveniente, e por isso não cabe ação direta contra norma anterior, mas cabe arguição de descumprimento de preceito fundamental. O poder reformador é limitado pelas cláusulas pétreas, artigo 60, parágrafo 4º. Em prova: se a questão disser que cabe ADI contra lei anterior à Constituição por inconstitucionalidade superveniente, está errada. Guarde: anterior incompatível é revogada, não inconstitucional. Revise, estudante. Até a próxima lição.","id":"43","q":{"a":"Teoria da Constituição e poder constituinte","n":33,"d":"MP e ENAM 15, Juiz 16, Defensoria 2, Analista 0; contagem aproximada"}},{"t":"Federalismo: competências legislativas e o Município","link":"","k":"new","txt":"O estudo de hoje é sobre a repartição de competências legislativas. O que cabe a cada ente? A União legisla privativamente sobre as matérias do artigo 22, e uma lei complementar pode autorizar os Estados a legislar sobre pontos específicos. Na competência concorrente, artigo 24, a União edita normas gerais, e os Estados suplementam. Ao Município cabe legislar sobre assuntos de interesse local e suplementar a legislação federal e estadual, no que couber, artigo 30. No exemplo clássico, o Supremo editou a Súmula Vinculante 38: é competente o Município para fixar o horário de funcionamento de estabelecimento comercial. Em prova: se a questão disser que o Município pode legislar sobre direito civil ou trânsito, está errada. Guarde: Município, interesse local e suplementação; direito civil e trânsito, União. Revise, estudante. Até a próxima lição.","id":"44","q":{"a":"Federalismo e competências","n":33,"d":"MP e ENAM 8, Juiz 23, Defensoria 1, Analista 1; contagem aproximada"}},{"t":"Pessoa com deficiência: capacidade, curatela e reserva de vagas","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a pessoa com deficiência, Lei 13.146, de 2015. A deficiência afeta a capacidade civil? Não, artigo 6º: a pessoa com deficiência é plenamente capaz, inclusive para casar, constituir união estável e exercer direitos reprodutivos. A curatela é medida extraordinária, proporcional às necessidades do caso, e afeta só os atos patrimoniais e negociais, artigo 85. Existe ainda a tomada de decisão apoiada, artigo 1.783-A do Código Civil. Nos concursos, a Constituição, artigo 37, inciso VIII, reserva percentual de cargos e empregos públicos. Em prova: se a questão disser que a curatela atinge o direito ao casamento, ou que a pessoa com deficiência é absolutamente incapaz, está errada. Guarde: curatela só para atos patrimoniais e negociais. Revise, estudante. Até a próxima lição.","id":"56","q":{"a":"Pessoa com deficiência","n":21,"d":"MP e ENAM 10, Juiz 4, Defensoria 3, Analista 4; contagem aproximada"}},{"t":"Terras indígenas: marco temporal (Tema 1.031 e Lei 14.701)","link":"","k":"new","txt":"O assunto de hoje é o marco temporal das terras indígenas. O artigo 231 da Constituição reconhece aos povos indígenas os direitos originários sobre as terras que tradicionalmente ocupam, que são bens da União, inalienáveis e imprescritíveis. No Tema 1.031, o Supremo rejeitou a tese de que só seriam indígenas as terras ocupadas em 5 de outubro de 1988. Depois, ao julgar a Lei 14.701, de 2023, o Supremo afastou novamente o marco temporal e o requisito do renitente esbulho, como critério para reconhecer a ocupação tradicional. Em prova: se a questão disser que o marco temporal de 1988 é condição para a demarcação, está errada. Guarde: demarcação não depende de ocupação em 1988; terras indígenas pertencem à União. Revise, estudante. Até a próxima lição.","id":"57","q":{"a":"Povos indígenas e quilombolas","n":20,"d":"MP e ENAM 4, Juiz 5, Defensoria 9, Analista 2; contagem aproximada"}},{"t":"Pessoa idosa: prioridade, alimentos e gratuidade","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a pessoa idosa, Lei 10.741. Quem é idoso? A pessoa com idade igual ou superior a sessenta anos, artigo 1º. Nos processos, tem prioridade de tramitação desde os sessenta, e prioridade especial, dentro da prioridade, para quem tem mais de oitenta anos, artigo 71. Os alimentos são solidários, e o idoso pode escolher o prestador, artigo 12. A gratuidade no transporte coletivo urbano é para maiores de sessenta e cinco anos, artigo 230, parágrafo 2º, da Constituição. Em prova: se a questão disser que a gratuidade do transporte público é garantida a partir dos sessenta anos, ou que a prioridade processual só começa aos oitenta, está errada. Guarde: prioridade, sessenta; gratuidade no transporte, sessenta e cinco. Revise, estudante. Até a próxima lição.","id":"58","q":{"a":"Pessoa idosa","n":20,"d":"MP e ENAM 5, Juiz 10, Defensoria 3, Analista 2; contagem aproximada"}},{"t":"Intervenção federal e estadual","link":"","k":"new","txt":"O assunto de hoje é a intervenção. A regra é a autonomia dos entes, e a intervenção é exceção, de hipóteses taxativas. A União intervém nos Estados e no Distrito Federal, artigo 34. Os Estados intervêm nos Municípios, artigo 35, em casos como a dívida fundada não paga por dois anos consecutivos, a falta de prestação de contas e a não aplicação do mínimo exigido da receita na educação e na saúde. A União não intervém em Município de Estado, salvo nos Territórios. A intervenção por desobediência a ordem judicial depende de requisição do Supremo, do STJ ou do TSE, artigo 36, inciso II. Em prova: se a questão disser que a União pode intervir diretamente em Município localizado em Estado, está errada. Guarde: Estado intervém no Município; União, só nos Territórios. Revise, estudante. Até a próxima lição.","id":"65","q":{"a":"Intervenção federal e estadual","n":11,"d":"MP e ENAM 7, Juiz 3, Defensoria 1, Analista 0; contagem aproximada"}},{"t":"Ordem econômica: livre concorrência e intervenção do Estado","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a ordem econômica, artigo 170 da Constituição. Ela se funda na valorização do trabalho humano e na livre iniciativa, e tem entre os princípios a livre concorrência e a defesa do consumidor. A exploração direta de atividade econômica pelo Estado só ocorre por imperativo de segurança nacional ou relevante interesse coletivo, artigo 173. Como agente normativo e regulador, o Estado fiscaliza, incentiva e planeja, artigo 174. A Súmula Vinculante 49 diz que ofende a livre concorrência a lei municipal que impede a instalação de estabelecimentos do mesmo ramo em determinada área. Em prova: se a questão disser que o Município pode vedar, por lei, a instalação de um segundo estabelecimento do mesmo ramo numa região, está errada. Guarde: o Município não pode restringir a concorrência. Revise, estudante. Até a próxima lição.","id":"67","q":{"a":"Ordem econômica e concorrência","n":10,"d":"MP e ENAM 3, Juiz 6, Defensoria 0, Analista 1; contagem aproximada"}},{"t":"Advocacia Pública: parecer, honorários e responsabilidade","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a Advocacia Pública, artigos 131 e 132 da Constituição. O advogado público responde pelo parecer que emite? Depende. Pelo entendimento do Supremo, só em caso de erro grosseiro ou dolo, e o artigo 28 da LINDB exige essa culpa qualificada. Quanto aos honorários de sucumbência, a Súmula Vinculante 47 reconhece a natureza alimentar, e na ADI 6.053 o Supremo os declarou constitucionais para advogados públicos, sujeitos ao teto remuneratório. A representação judicial dos Estados e do Distrito Federal cabe aos procuradores organizados em carreira, com ingresso por concurso com a participação da OAB, artigo 132. Em prova: se a questão disser que o parecerista responde por qualquer divergência de opinião, está errada. Guarde: parecer, só dolo ou erro grosseiro. Revise, estudante. Até a próxima lição.","id":"74","q":{"a":"Advocacia Pública","n":4,"d":"MP e ENAM 0, Juiz 2, Defensoria 2, Analista 0; contagem aproximada"}},{"t":"Tutela coletiva: ação civil pública, inquérito civil e TAC","link":"","k":"new","txt":"O assunto de hoje é a ação civil pública, Lei 7.347. Estão legitimados o Ministério Público, a Defensoria, os entes federados, as autarquias, as empresas públicas, as fundações, as sociedades de economia mista e as associações constituídas há um ano e com pertinência temática, artigo 5º. O inquérito civil é privativo do Ministério Público. O termo de ajustamento de conduta, parágrafo 6º, tem eficácia de título executivo extrajudicial. A competência é do foro do local do dano. Nos direitos difusos e coletivos, a sentença de improcedência por falta de provas não faz coisa julgada, e qualquer legitimado pode repropor. Em prova: se a questão disser que o município não tem legitimidade para propor a ação civil pública, ou que o inquérito civil pode ser instaurado por qualquer legitimado, está errada. Guarde: município legitimado; inquérito, só MP; TAC, título executivo. Revise, estudante. Até a próxima lição.","id":"88","q":{"a":"Tutela coletiva","n":45,"d":"MP e ENAM 14, Juiz 17, Defensoria 13, Analista 1; contagem aproximada"}},{"t":"Controle concentrado: ADI, ADC, ADPF e ADO","link":"","k":"new","txt":"A lição de hoje é o controle concentrado. A ADI e a ADC são julgadas pelo Supremo, artigo 102, e os legitimados estão no artigo 103: Presidente, Mesas do Senado, da Câmara e das Assembleias, Governador, Procurador-Geral, OAB, partido com representação no Congresso e confederação sindical ou entidade de classe nacional. Governador, Mesas das Assembleias e entidades de classe precisam demonstrar pertinência temática. A ADPF, Lei 9.882, é subsidiária e cabe contra lei municipal e direito anterior à Constituição. A lei municipal não pode ser objeto de ADI no Supremo; o controle é feito no Tribunal de Justiça, em face da Constituição estadual. A modulação de efeitos exige dois terços dos ministros. Em prova: se a questão disser que cabe ADI no Supremo contra lei municipal, ou que o Governador não precisa demonstrar pertinência temática, está errada. Guarde: lei municipal, ADPF ou TJ; modulação, dois terços. Revise, estudante. Até a próxima lição.","id":"92","q":{"a":"Controle concentrado","n":32,"d":"MP e ENAM 0, Juiz 11, Defensoria 15, Analista 2; contagem aproximada"}},{"t":"Nacionalidade, direitos políticos e remédios constitucionais","link":"","k":"new","txt":"A lição de hoje cobre nacionalidade, direitos políticos e remédios. É brasileiro nato quem nasce no Brasil, ainda que de pais estrangeiros, salvo se a serviço de seu país. O brasileiro nato nunca é extraditado, e o naturalizado só por crime comum anterior à naturalização ou por tráfico. Os cargos de Presidente, Presidente da Câmara e do Senado, Ministro do Supremo e carreira diplomática são privativos de nato. A cassação de direitos políticos é vedada; a perda e a suspensão ocorrem nos casos do artigo 15, como condenação criminal transitada enquanto durarem seus efeitos e improbidade. O habeas corpus protege a liberdade de locomoção; o habeas data, o acesso a informações pessoais; o mandado de injunção, a falta de norma regulamentadora. Em prova: se a questão disser que a cassação de direitos políticos é admitida, está errada. Guarde: nato não se extradita; cassação, vedada. Revise, estudante. Até a próxima lição.","id":"94","q":{"a":"Nacionalidade e remédios","n":29,"d":"MP e ENAM 0, Juiz 14, Defensoria 7, Analista 5; contagem aproximada"}},{"t":"ECA: Conselho Tutelar e proteção integral","link":"","k":"new","txt":"A lição de hoje é o Estatuto da Criança e do Adolescente, Lei 8.069. Criança é quem tem até doze anos incompletos, e adolescente, de doze a dezoito. Vigora a proteção integral e a prioridade absoluta, artigo 227 da Constituição, dever da família, da sociedade e do Estado. O Conselho Tutelar é órgão permanente, autônomo e não jurisdicional, com ao menos um por município e cinco membros, eleitos para mandato de quatro anos. Ele aplica medidas de proteção e requisita serviços, mas o afastamento da criança do convívio familiar é da autoridade judiciária. O município mantém o conselho de direitos e o fundo. A Lei 15.211, o ECA Digital, impõe aos serviços digitais deveres de proteção, como a verificação de idade. Em prova: se a questão disser que o Conselho Tutelar pode determinar o acolhimento institucional, está errada. Guarde: conselho não julga; acolhimento, juiz. Revise, estudante. Até a próxima lição.","id":"104","q":{"a":"ECA e Conselho Tutelar","n":73,"d":"MP e ENAM 21, Juiz 34, Defensoria 15, Analista 0; contagem aproximada"}},{"t":"Magistratura, CNJ e ética judicial","link":"","k":"new","txt":"O tema de hoje é a magistratura. O ingresso é por concurso, com três anos de atividade jurídica, artigo 93. As garantias são a vitaliciedade, adquirida após dois anos de exercício, a inamovibilidade e a irredutibilidade de subsídio, artigo 95. Os juízes não podem exercer outra função, salvo uma de magistério, nem receber custas, nem se dedicar à atividade político-partidária, e há quarentena de três anos para advogar no juízo de que se afastaram. O Conselho Nacional de Justiça tem quinze membros, mandato de dois anos, controla a atuação administrativa e financeira do Judiciário e os deveres funcionais dos juízes, mas não exerce jurisdição, e não tem poder sobre o Supremo. Em prova: se a questão disser que o CNJ controla os atos do Supremo Tribunal Federal, está errada. Guarde: vitaliciedade em dois anos; quarentena de três; CNJ fora do Supremo. Revise, estudante. Até a próxima lição.","id":"105","q":{"a":"Magistratura e CNJ","n":67,"d":"MP e ENAM 12, Juiz 23, Defensoria 8, Analista 22; contagem aproximada"}},{"t":"Direitos humanos: igualdade, racismo, gênero e LGBT","link":"","k":"new","txt":"A lição de hoje trata de igualdade e não discriminação. A prática do racismo é crime inafiançável e imprescritível, artigo 5º, inciso XLII, regulado pela Lei 7.716. A Lei 14.532 equiparou a injúria racial ao racismo. O Supremo, na ADO 26, enquadrou a homofobia e a transfobia no conceito de racismo, até que o Congresso legisle. A ADC 41 declarou constitucionais as cotas raciais em concursos, com a heteroidentificação complementar. Na ADI 4275, reconheceu o direito da pessoa trans de alterar o registro civil sem cirurgia. O Protocolo para Julgamento com Perspectiva de Gênero, Resolução 492 do CNJ, é de observância obrigatória pelos magistrados. Em prova: se a questão disser que a injúria racial é crime prescritível e afiançável, está errada. Guarde: racismo, imprescritível e inafiançável; protocolo do CNJ obrigatório. Revise, estudante. Até a próxima lição.","id":"106","q":{"a":"Direitos humanos","n":61,"d":"MP e ENAM 9, Juiz 16, Defensoria 31, Analista 3; contagem aproximada"}}]},{"tema":"Tributário e Financeiro","itens":[{"t":"Taxa: lixo, iluminação e COSIP","link":"https://drive.google.com/file/d/1IihEF-TUDRr2r4-kt-Z2jhIbzCe2nExX/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é taxa, lixo, iluminação e COSIP. Taxa só pode ser cobrada por serviço específico e divisível, ou seja, que dê para medir quem usa. A Súmula Vinculante 19 diz que a taxa de coleta domiciliar de lixo é válida. Mas limpeza de vias e serviços gerais não podem ser custeados por taxa. Iluminação pública é serviço geral, indivisível. Pela Súmula Vinculante 41, não pode haver taxa de iluminação. O custeio se faz pela contribuição, a COSIP, e no RE 573.675 o Supremo admitiu alíquotas progressivas conforme o consumo de energia. Em prova: lixo domiciliar, taxa; iluminação, COSIP. Guarde: serviço divisível e específico, taxa; serviço geral, não. Revise, estudante. Até a próxima lição.","id":"10","q":{"a":"Taxas","n":18,"d":"MP e ENAM 1, Juiz 12, Defensoria 5, Analista 0; contagem aproximada"}},{"t":"Taxa e tarifa; base de cálculo da taxa","link":"https://drive.google.com/file/d/1vXZp735lfNvOd52nuX4OItr9Ah4Lxjdy/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é taxa e tarifa, e a base de cálculo da taxa. Taxa e tarifa não são a mesma coisa. Pela Súmula 545 do STJ, a taxa é compulsória e decorre de lei. A tarifa, o preço público, é facultativa: só paga quem usa o serviço. E a base de cálculo da taxa? A Constituição proíbe que ela tenha base própria de imposto. Mas, pela Súmula Vinculante 29, é constitucional a taxa que adote um ou mais elementos da base de cálculo de imposto, desde que não haja identidade integral. Em prova: a banca diz que usar qualquer elemento da base do imposto invalida a taxa. Só a identidade total. Guarde: taxa é compulsória; usar elemento da base do imposto, pode; identidade integral, não. Revise, estudante. Até a próxima lição.","id":"11","q":{"a":"Taxas","n":18,"d":"MP e ENAM 1, Juiz 12, Defensoria 5, Analista 0; contagem aproximada"}},{"t":"LRF: despesa com pessoal e limite prudencial","link":"https://drive.google.com/file/d/1Z-bqjgx8Jwvp8CVg-YinkYxeQ_pQ5LFc/view?usp=drive_link","k":"lit","txt":"Estudante, aqui é o Dr. Aloisio, e a lição de hoje é a Lei de Responsabilidade Fiscal. A ideia central: gestão planejada e transparente, que previne riscos e mantém o equilíbrio das contas públicas. Despesa com pessoal: Municípios podem gastar no máximo 60 por cento da receita corrente líquida, sendo 54 para o Executivo e 6 para o Legislativo. Passou de 95 por cento do limite, é o limite prudencial: ficam vedados aumento, criação de cargo e contratação, salvo exceções. Estourou o limite? Elimine o excedente em dois quadrimestres, ao menos um terço no primeiro. Atenção: é nulo o ato que aumenta despesa com pessoal nos 180 dias finais do mandato. E nos dois últimos quadrimestres, é vedado assumir despesa que não possa ser paga dentro do mandato, sem caixa. Renúncia de receita exige estimativa de impacto. A transparência vem pelo RREO e pelo RGF. Revise, estudante. Até a próxima lição.","id":"12","q":{"a":"Execução fiscal e direito financeiro","n":36,"d":"MP e ENAM 3, Juiz 23, Defensoria 7, Analista 3; contagem aproximada"}},{"t":"Tributário geral: anterioridade, decadência e reforma tributária","link":"","k":"new","txt":"O estudo de hoje é sobre o direito tributário geral. Quais limites protegem o contribuinte? Pelo artigo 150 da Constituição, o tributo exige lei, respeita a anterioridade anual e a nonagesimal, e há imunidade recíproca entre os entes. Quanto ao prazo do Fisco, o artigo 173 do Código Tributário dá cinco anos para constituir o crédito, e no lançamento por homologação, o artigo 150, parágrafo 4º, conta do fato gerador. Pela Emenda 132, de 2023, e a Lei Complementar 214, de 2025, o IBS e a CBS substituirão ICMS, ISS, PIS e Cofins, com transição de 2026 a 2033. Em prova: se a questão disser que o ICMS e o ISS foram extintos em 2026, está errada. Guarde: 2026 é teste; ICMS e ISS só deixam de existir em 2033. Revise, estudante. Até a próxima lição.","id":"25","q":{"a":"Tributário geral (impostos, lançamento, imunidades, reforma)","n":59,"d":"MP e ENAM 16, Juiz 39, Defensoria 3, Analista 1; contagem aproximada"}},{"t":"Execução fiscal: baixo valor (Tema 1.184) e prescrição intercorrente","link":"","k":"new","txt":"O estudo de hoje é sobre a execução fiscal, regida pela Lei 6.830. Cobrar dívida pequena sempre vale a pena? No Tema 1.184, o Supremo decidiu que é legítima a extinção de execução fiscal de baixo valor por falta de interesse de agir. Antes de ajuizar, o ente deve tentar a conciliação ou solução administrativa e protestar o título, salvo dispensa justificada. Na defesa, a exceção de pré-executividade, Súmula 393 do STJ, só serve para matérias conhecíveis de ofício que não exijam prova. Os embargos têm trinta dias, artigo 16. E, pela Súmula 314, se não houver bens, suspende-se o processo por um ano, e depois corre a prescrição intercorrente de cinco anos. Em prova: se a questão disser que a exceção de pré-executividade admite dilação probatória, está errada. Guarde: baixo valor, conciliação e protesto antes; sem bens, um ano e depois cinco. Revise, estudante. Até a próxima lição.","id":"36","q":{"a":"Execução fiscal e direito financeiro","n":36,"d":"MP e ENAM 3, Juiz 23, Defensoria 7, Analista 3; contagem aproximada"}},{"t":"Orçamento público: PPA, LDO, LOA e créditos adicionais","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre o orçamento público. Quais são as leis orçamentárias? Pelo artigo 165 da Constituição, o plano plurianual, a lei de diretrizes orçamentárias e a lei orçamentária anual. Pelo princípio da exclusividade, a lei orçamentária só trata de receita e despesa, salvo créditos suplementares. Os créditos adicionais, da Lei 4.320, são de três tipos: o suplementar reforça dotação já existente; o especial cobre despesa sem dotação específica; o extraordinário atende despesa imprevisível e urgente. Suplementares e especiais dependem de autorização legislativa e indicação de recursos, artigo 167, inciso V. Em prova: se a questão disser que o crédito especial serve para reforçar dotação existente, está errada. Guarde: suplementar reforça; especial inova; extraordinário é urgência. Revise, estudante. Até a próxima lição.","id":"37","q":{"a":"Execução fiscal e direito financeiro","n":36,"d":"MP e ENAM 3, Juiz 23, Defensoria 7, Analista 3; contagem aproximada"}},{"t":"Precatórios e RPV: a Emenda 136/2025","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre os precatórios, artigo 100 da Constituição. Como funciona o pagamento? Os débitos da Fazenda são pagos na ordem cronológica de apresentação, e os de pequeno valor, definidos por lei de cada ente, são pagos por requisição, sem precatório. A Emenda 136, de 2025, antecipou a data limite para apresentação dos precatórios de 2 de abril para 1º de fevereiro, e passou a atualizá-los pelo IPCA mais juros de dois por cento ao ano, limitados à Selic. Para Estados e Municípios, impôs um limite anual de pagamento, calculado em percentual da receita corrente líquida, que cresce conforme o estoque devido. Em prova: se a questão disser que a Emenda 136 manteve a atualização apenas pela Selic, está errada. Guarde: IPCA mais dois por cento, limitado à Selic. Revise, estudante. Até a próxima lição.","id":"72","q":{"a":"Precatórios e RPV","n":5,"d":"MP e ENAM 0, Juiz 3, Defensoria 2, Analista 0; contagem aproximada"}},{"t":"Impostos municipais: IPTU, ITBI e ISS","link":"","k":"new","txt":"Hoje o tema são os impostos municipais. O IPTU incide sobre a propriedade, o domínio útil ou a posse de imóvel urbano, e tem alíquotas progressivas no tempo e por valor. O ITBI incide sobre a transmissão onerosa inter vivos de imóveis, e o fato gerador é o registro, não o contrato; não incide na integralização de capital, artigo 156, parágrafo 2º. Segundo o STJ, a base de cálculo é o valor de mercado, e não fica vinculada ao do IPTU. O ISS, Lei Complementar 116, tem alíquota mínima de dois por cento e máxima de cinco, e a Súmula Vinculante 31 afasta a incidência sobre locação de bens móveis. Em prova: se a questão disser que o ITBI incide sobre o registro da promessa de compra e venda, ou que o ISS pode incidir sobre a locação de bens móveis, está errada. Guarde: ITBI, registro; ISS, entre dois e cinco. Revise, estudante. Até a próxima lição.","id":"87","q":{"a":"Impostos em espécie","n":49,"d":"MP e ENAM 10, Juiz 26, Defensoria 5, Analista 2; contagem aproximada"}},{"t":"Responsabilidade tributária e sucessão","link":"","k":"new","txt":"O estudo de hoje é a responsabilidade tributária. Na sucessão imobiliária, o adquirente responde pelos tributos do imóvel, artigo 130, salvo se a prova de quitação consta do título. Na sucessão empresarial, quem adquire fundo de comércio responde integralmente se o alienante cessa a atividade, e subsidiariamente se continua em seis meses, artigo 133; o artigo 132 trata de fusão, incorporação e transformação. Os administradores respondem pessoalmente por atos com excesso de poderes ou infração à lei, artigo 135, e, pela Súmula 435 do STJ, a dissolução irregular presume essa infração. O simples inadimplemento não gera responsabilidade do sócio, Súmula 430. Em prova: se a questão disser que o mero inadimplemento da empresa responsabiliza pessoalmente o sócio, está errada. Guarde: 130 imóvel; 133 empresa; 135 pessoal; Súmula 430. Revise, estudante. Até a próxima lição.","id":"95","q":{"a":"Responsabilidade tributária","n":21,"d":"MP e ENAM 0, Juiz 12, Defensoria 6, Analista 1; contagem aproximada"}},{"t":"Compensação, restituição e extinção do crédito","link":"","k":"new","txt":"Hoje o tema é a extinção do crédito tributário. O artigo 156 do Código Tributário lista as modalidades: pagamento, compensação, transação, remissão, prescrição e decadência, conversão de depósito em renda, entre outras. A compensação depende de lei autorizativa, artigo 170, e é vedada antes do trânsito em julgado, artigo 170-A. A restituição do indébito prescreve em cinco anos da extinção do crédito, artigo 168. Nos tributos indiretos, só pede a restituição quem provar que assumiu o encargo, ou tiver autorização de quem o suportou, artigo 166. Pela Súmula 162 do STJ, a correção monetária incide desde o pagamento indevido, e, pela Súmula 188, os juros de mora correm do trânsito em julgado. Em prova: se a questão disser que a compensação pode ser feita antes do trânsito em julgado da ação, está errada. Guarde: 170-A; cinco anos; Súmulas 162 e 188. Revise, estudante. Até a próxima lição.","id":"97","q":{"a":"Compensação e restituição","n":13,"d":"MP e ENAM 0, Juiz 10, Defensoria 0, Analista 0; contagem aproximada"}},{"t":"Imunidades e isenções","link":"","k":"new","txt":"O assunto de hoje são as imunidades e as isenções. A imunidade é limite constitucional ao poder de tributar, artigo 150, inciso VI: veda impostos sobre patrimônio, renda e serviços dos entes federados, de templos, de partidos, sindicatos de trabalhadores, instituições de educação e assistência sem fins lucrativos, e sobre livros, jornais e papel. A imunidade recíproca alcança autarquias e fundações, e o Supremo a estende a empresas públicas que prestam serviço público sem concorrência. Pela Súmula Vinculante 52, o imóvel alugado de entidade imune continua imune ao IPTU se o aluguel financia suas atividades. A isenção, ao contrário, é dispensa legal, exclusão do crédito, e exige lei específica, artigo 150, parágrafo 6º, com interpretação literal. Em prova: se a questão disser que a isenção é limitação constitucional ao poder de tributar, está errada. Guarde: imunidade na Constituição; isenção, em lei. Revise, estudante. Até a próxima lição.","id":"100","q":{"a":"Imunidades e isenções","n":8,"d":"MP e ENAM 3, Juiz 2, Defensoria 2, Analista 0; contagem aproximada"}}]},{"tema":"Processual Civil","itens":[{"t":"Recursos: prazos, Fazenda em dobro e agravo (Tema 988)","link":"","k":"new","txt":"O assunto de hoje é o sistema de recursos do Código de Processo Civil. Qual é o prazo e o que muda para a Fazenda Pública? Pelo artigo 1.003, o prazo é de quinze dias úteis, exceto embargos de declaração, que são cinco. A Fazenda Pública tem prazo em dobro, pelo artigo 183. O agravo de instrumento cabe nas hipóteses do artigo 1.015, mas no Tema 988 o STJ adotou a taxatividade mitigada: cabe também quando a urgência tornar inútil esperar a apelação. A apelação tem, em regra, efeito suspensivo; o recurso especial e o extraordinário, não. Em prova: se a questão disser que o rol do artigo 1.015 é absolutamente taxativo, ou que a Fazenda não tem prazo em dobro, está errada. Guarde: quinze dias úteis; Fazenda em dobro; rol taxativo, porém mitigado. Revise, estudante. Até a próxima lição.","id":"20","q":{"a":"Recursos","n":75,"d":"MP e ENAM 9, Juiz 45, Defensoria 13, Analista 8; contagem aproximada"}},{"t":"Revelia: o que presume e quando não presume","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a revelia. Réu que não contesta perde o processo? Pelo artigo 344 do Código de Processo Civil, presumem-se verdadeiras as alegações de fato do autor. Mas o artigo 345 afasta esse efeito em quatro casos: havendo pluralidade de réus e algum contestar; se o litígio versar sobre direitos indisponíveis, o que alcança a Fazenda Pública; se a petição inicial não trouxer instrumento indispensável; e se as alegações forem inverossímeis ou contraditórias com a prova. A contestação é de quinze dias úteis, e vale a impugnação especificada, artigo 341. Em prova: se a questão disser que a revelia da Fazenda Pública gera presunção de veracidade dos fatos, ou que a revelia dá ao autor vitória automática, está errada. Guarde: revelia presume fatos, mas não contra direito indisponível. Revise, estudante. Até a próxima lição.","id":"21","q":{"a":"Petição inicial, contestação e revelia","n":73,"d":"MP e ENAM 7, Juiz 45, Defensoria 11, Analista 10; contagem aproximada"}},{"t":"Cumprimento de sentença contra a Fazenda Pública","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre o cumprimento de sentença. Como funciona contra a Fazenda Pública? Contra o particular, o devedor tem quinze dias úteis para pagar, sob multa de dez por cento, artigo 523. Contra a Fazenda, o regime é outro, artigos 534 e 535: ela é intimada para impugnar em trinta dias, sem multa e sem penhora. Não havendo impugnação, expede-se precatório ou requisição de pequeno valor, conforme o artigo 100 da Constituição. E, pelo artigo 85, parágrafo 7º, não são devidos honorários no cumprimento contra a Fazenda que dê ensejo a precatório, se não houver impugnação. Em prova: se a questão disser que a Fazenda Pública sofre multa de dez por cento ou penhora de bens para pagar a condenação, está errada. Guarde: Fazenda, trinta dias; sem multa; pagamento por precatório ou RPV. Revise, estudante. Até a próxima lição.","id":"24","q":{"a":"Cumprimento de sentença e execução","n":65,"d":"MP e ENAM 11, Juiz 38, Defensoria 8, Analista 8; contagem aproximada"}},{"t":"Juizados, mediação e arbitragem","link":"","k":"new","txt":"O assunto de hoje são os Juizados Especiais, a mediação e a arbitragem. O Município pode ser réu no Juizado? Sim, no Juizado da Fazenda Pública, Lei 12.153, de 2009, em causas de até sessenta salários mínimos. Ficam de fora, pelo artigo 2º, mandado de segurança, desapropriação, ações populares, execuções fiscais e improbidade. Já a Lei 9.099 trata de causas de até quarenta salários, e a Fazenda não é parte nela. A mediação, Lei 13.140, alcança conflitos da Administração, e a arbitragem, Lei 9.307, pode ser usada pela Administração em direitos patrimoniais disponíveis. Em prova: se a questão disser que o Juizado da Fazenda julga execução fiscal ou improbidade, ou que a Administração não pode usar arbitragem, está errada. Guarde: Fazenda, sessenta salários; arbitragem só em direito disponível. Revise, estudante. Até a próxima lição.","id":"27","q":{"a":"Juizados, mediação e arbitragem","n":51,"d":"MP e ENAM 5, Juiz 27, Defensoria 9, Analista 10; contagem aproximada"}},{"t":"Mandado de segurança: prazo, honorários e súmulas","link":"","k":"new","txt":"O assunto de hoje é o mandado de segurança. Qual é o prazo e o que o Supremo decidiu sobre a Lei 12.016? O prazo é de cento e vinte dias, contados da ciência do ato, artigo 23, e o Supremo o considerou constitucional. Não cabem honorários de sucumbência, artigo 25. A Súmula 266 veda mandado de segurança contra lei em tese, e a Súmula 269, como substitutivo de ação de cobrança. O Supremo declarou inconstitucional a vedação de liminar do artigo 7º, parágrafo 2º. Em prova: se a questão disser que o mandado de segurança admite honorários, ou que o prazo de cento e vinte dias é inconstitucional, está errada. Guarde: cento e vinte dias; sem honorários; contra lei em tese, não cabe. Revise, estudante. Até a próxima lição.","id":"30","q":{"a":"Mandado de segurança","n":44,"d":"MP e ENAM 8, Juiz 19, Defensoria 6, Analista 11; contagem aproximada"}},{"t":"Normas fundamentais do processo civil","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre as normas fundamentais do Código de Processo Civil, artigos 1º a 12. Quais são as principais? Cooperação, artigo 6º, e boa-fé, artigo 5º. Duração razoável, artigo 4º. Contraditório, artigos 9º e 10, o que proíbe a decisão surpresa: o juiz não decide com base em fundamento sobre o qual não se deu oportunidade de manifestação, mesmo nas matérias de ofício. O artigo 9º dispensa o contraditório prévio na tutela de urgência e em certas hipóteses de evidência. A arbitragem é permitida e a solução consensual deve ser estimulada, artigo 3º. Em prova: se a questão disser que o juiz pode decidir de ofício, com base em fundamento novo, sem ouvir as partes, está errada. Guarde: contraditório prévio, salvo urgência e evidência. Revise, estudante. Até a próxima lição.","id":"31","q":{"a":"Normas fundamentais do processo civil","n":41,"d":"MP e ENAM 12, Juiz 8, Defensoria 7, Analista 14; contagem aproximada"}},{"t":"Litisconsórcio e intervenção de terceiros","link":"","k":"new","txt":"O assunto de hoje é o litisconsórcio e a intervenção de terceiros. Qual é a diferença entre litisconsórcio necessário e unitário? O necessário decorre da lei ou da natureza da relação, e sem a citação de todos a decisão é ineficaz, artigo 114. O unitário exige decisão uniforme para todos. Se unitário e necessário faltar parte, a sentença é nula; se for simples, é ineficaz em relação aos não citados, artigo 115. Entre as intervenções estão a assistência, a denunciação da lide, o chamamento ao processo, o incidente de desconsideração da personalidade jurídica e o amicus curiae. Em prova: se a questão disser que a denunciação da lide é obrigatória, sob pena de perder o direito de regresso, está errada. Guarde: o regresso pode ser exercido em ação autônoma, artigo 125, parágrafo 1º. Revise, estudante. Até a próxima lição.","id":"33","q":{"a":"Litisconsórcio e intervenção de terceiros","n":39,"d":"MP e ENAM 6, Juiz 21, Defensoria 9, Analista 3; contagem aproximada"}},{"t":"Provas: ônus, fatos que dispensam prova e atipicidade","link":"","k":"new","txt":"O estudo de hoje é sobre as provas no Código de Processo Civil. Quem tem o ônus de provar? Pelo artigo 373, ao autor cabe o fato constitutivo, e ao réu o fato impeditivo, modificativo ou extintivo. O juiz pode redistribuir o ônus por decisão fundamentada, mas não pode gerar situação em que o encargo seja impossível ou excessivamente difícil. O artigo 374 dispensa prova dos fatos notórios, dos afirmados por uma parte e confessados pela outra, dos incontroversos e dos que têm presunção legal. Os meios de prova são amplos, artigo 369, e o juiz aprecia a prova pela persuasão racional, artigo 371. Em prova: se a questão disser que a inversão do ônus é automática, ou que exige prova diabólica da parte, está errada. Guarde: ônus em regra do autor; redistribuição só com decisão fundamentada. Revise, estudante. Até a próxima lição.","id":"35","q":{"a":"Provas","n":36,"d":"MP e ENAM 3, Juiz 23, Defensoria 9, Analista 1; contagem aproximada"}},{"t":"Honorários advocatícios e gratuidade da justiça","link":"","k":"new","txt":"O assunto de hoje são os honorários e a gratuidade da justiça. Como se fixam os honorários contra a Fazenda Pública? Pelo artigo 85, parágrafo 3º, do Código de Processo Civil, em faixas decrescentes conforme o valor da condenação, de dez a vinte por cento nas menores até um a três por cento nas maiores. No Tema 1.076, o STJ decidiu que a equidade só vale quando o proveito econômico for inestimável ou irrisório, ou o valor da causa muito baixo. Quanto à gratuidade, presume-se verdadeira a alegação de insuficiência da pessoa natural, artigo 99, parágrafo 3º, mas a pessoa jurídica deve prová-la, Súmula 481 do STJ. Em prova: se a questão disser que a gratuidade isenta o vencido de ser condenado em honorários, ou que a pessoa jurídica goza de presunção absoluta, está errada. Guarde: gratuidade suspende a cobrança, não afasta a condenação. Revise, estudante. Até a próxima lição.","id":"38","q":{"a":"Honorários e gratuidade","n":35,"d":"MP e ENAM 5, Juiz 16, Defensoria 12, Analista 2; contagem aproximada"}},{"t":"Fazenda Pública em juízo: prazos e remessa necessária","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre as prerrogativas da Fazenda Pública em juízo. Quais são? Prazo em dobro para todas as manifestações e intimação pessoal, artigo 183 do Código de Processo Civil. A remessa necessária, artigo 496, submete ao tribunal a sentença contra a Fazenda, mas só quando o valor passa do limite: mil salários mínimos para a União, quinhentos para Estados, Distrito Federal e capitais, como Curitiba, e cem para os demais Municípios. Também é dispensada quando a sentença seguir súmula de tribunal superior, acórdão em recurso repetitivo, IRDR, IAC ou entendimento administrativo consolidado. Em prova: se a questão disser que a remessa necessária se aplica a qualquer sentença contra o Município, qualquer que seja o valor, está errada. Guarde: capital, quinhentos salários; demais Municípios, cem. Revise, estudante. Até a próxima lição.","id":"39","q":{"a":"Fazenda Pública em juízo","n":35,"d":"MP e ENAM 3, Juiz 21, Defensoria 8, Analista 3; contagem aproximada"}},{"t":"Precedentes: IRDR, IAC e reclamação","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre o sistema de precedentes. O que os juízes devem observar? Pelo artigo 927 do Código de Processo Civil, as decisões do Supremo em controle concentrado, as súmulas vinculantes, os acórdãos em IRDR, IAC e recursos repetitivos, e as súmulas dos tribunais superiores. O IRDR, artigo 976, exige efetiva repetição de processos com a mesma questão de direito e risco à isonomia, e não cabe se tribunal superior já afetou recurso para definir a tese. O IAC, artigo 947, serve a questão de direito relevante, com grande repercussão social, mesmo sem repetição em múltiplos processos. A reclamação, artigo 988, garante a observância desses precedentes. Em prova: se a questão disser que o IRDR cabe diante de mero risco futuro de repetição, está errada. Guarde: IRDR, repetição efetiva; IAC, relevância sem repetição. Revise, estudante. Até a próxima lição.","id":"41","q":{"a":"Precedentes, IRDR e IAC","n":34,"d":"MP e ENAM 7, Juiz 21, Defensoria 3, Analista 3; contagem aproximada"}},{"t":"Competência: absoluta, relativa e foro da Fazenda","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a competência no processo civil. Qual é a diferença entre a absoluta e a relativa? A absoluta, em razão da matéria, da pessoa e da função, é inderrogável, pode ser reconhecida de ofício e alegada a qualquer tempo. A relativa, em razão do valor e do território, pode ser modificada pela vontade das partes, e deve ser alegada na contestação, artigo 64. Pela Súmula 33 do STJ, o juiz não pode declarar de ofício a incompetência relativa. A cláusula de eleição de foro abusiva é ineficaz e pode ser reconhecida de ofício antes da citação, artigo 63, parágrafo 3º. Em prova: se a questão disser que o juiz pode declarar de ofício a incompetência territorial, ou que a incompetência absoluta se prorroga se não alegada, está errada. Guarde: absoluta, de ofício e sempre; relativa, só na contestação. Revise, estudante. Até a próxima lição.","id":"45","q":{"a":"Competência no processo civil","n":33,"d":"MP e ENAM 6, Juiz 25, Defensoria 0, Analista 2; contagem aproximada"}},{"t":"Coisa julgada e ação rescisória","link":"","k":"new","txt":"No tópico de hoje vamos aprender sobre a coisa julgada e a ação rescisória. O que é coisa julgada? É a autoridade que torna a decisão de mérito indiscutível e imutável, quando não cabe mais recurso, artigo 502. Ela não prejudica terceiros, artigo 506. A rescisória, artigo 966, desconstitui decisão de mérito transitada em julgado, em hipóteses como prevaricação, dolo, ofensa à coisa julgada, violação manifesta de norma e prova falsa. O prazo é de dois anos, contados do trânsito em julgado da última decisão, artigo 975. A Fazenda Pública é dispensada do depósito de cinco por cento, artigo 968, parágrafo 1º. Em prova: se a questão disser que a coisa julgada prejudica terceiros, ou que a Fazenda deve depositar cinco por cento, está errada. Guarde: rescisória, dois anos; Fazenda, sem depósito. Revise, estudante. Até a próxima lição.","id":"47","q":{"a":"Sentença, coisa julgada e rescisória","n":30,"d":"MP e ENAM 2, Juiz 20, Defensoria 5, Analista 3; contagem aproximada"}},{"t":"Tutela provisória: urgência, evidência e estabilização","link":"","k":"new","txt":"O estudo de hoje é sob
