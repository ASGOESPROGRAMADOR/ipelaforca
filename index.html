ntal é objetiva, solidária e fundada no risco integral. As obrigações ambientais têm natureza propter rem, Súmula 623 do STJ, e acompanham o imóvel, mesmo que o dano tenha sido causado pelo dono anterior. A inversão do ônus da prova aplica-se às ações de degradação ambiental, Súmula 618 do STJ. A pretensão de reparação do dano ambiental é imprescritível, Tema 999 do Supremo. Em prova: se a questão disser que o adquirente do imóvel não responde pelo passivo ambiental deixado pelo antigo dono, ou que a reparação do dano ambiental prescreve em cinco anos, está errada. Guarde: objetiva, solidária, propter rem e imprescritível. Revise, estudante. Até a próxima lição.", "id": "51", "q": {"a": "Direito ambiental geral", "n": 55, "d": "MP e ENAM 18, Juiz 32, Defensoria 3, Analista 2; contagem aproximada"}}, {"t": "Direito urbanístico: função social e IPTU progressivo", "link": "", "k": "new", "txt": "O assunto de hoje é o direito urbanístico, Estatuto da Cidade, Lei 10.257. A propriedade urbana cumpre sua função social quando atende às exigências do plano diretor, artigo 182 da Constituição, obrigatório para cidades com mais de vinte mil habitantes. Se o solo for não edificado ou subutilizado, o Município exige parcelamento, edificação ou utilização compulsórios. Descumprida a exigência, aplica-se o IPTU progressivo no tempo, por cinco anos, com alíquota máxima de quinze por cento, e depois a desapropriação com pagamento em títulos da dívida pública. A usucapião especial urbana exige área de até duzentos e cinquenta metros quadrados e cinco anos de posse. Em prova: se a questão disser que a desapropriação urbanística é paga em dinheiro, está errada. Guarde: parcelar, IPTU progressivo, desapropriação com títulos. Revise, estudante. Até a próxima lição.", "id": "77", "q": {"a": "Direito urbanístico", "n": 5, "d": "MP e ENAM 0, Juiz 3, Defensoria 2, Analista 0; contagem aproximada"}}]}, {"tema": "Trabalho", "itens": [{"t": "Contratação sem concurso e terceirização na Administração", "link": "", "k": "new", "txt": "O estudo de hoje é sobre o contrato de trabalho com a Administração Pública. A contratação sem concurso é nula, artigo 37, parágrafo 2º, e, pela Súmula 363 do TST, só dá direito ao pagamento da contraprestação pactuada, e aos depósitos do FGTS. Sobre a terceirização, no julgamento da ADC 16, o Supremo decidiu que o inadimplemento do contratado não transfere automaticamente à Administração a responsabilidade pelos encargos. Ela responde subsidiariamente se ficar comprovada a falha na fiscalização do contrato, o que é a Súmula 331, item V, do TST. Em prova: se a questão disser que a Administração responde automaticamente pelas verbas trabalhistas da empresa terceirizada, está errada. Guarde: sem concurso, só salário e FGTS; terceirização, responsabilidade subsidiária só com culpa na fiscalização. Revise, estudante. Até a próxima lição.", "id": "63", "q": {"a": "Trabalho e Justiça do Trabalho", "n": 40, "d": "MP e ENAM 11, Juiz 10, Defensoria 6, Analista 13; contagem aproximada"}}]}, {"tema": "Empresarial", "itens": [{"t": "Sociedades empresariais: limitada, anônima e desconsideração", "link": "", "k": "new", "txt": "No tópico de hoje vamos aprender sobre as sociedades empresariais. Na sociedade limitada, a responsabilidade de cada sócio é restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social, artigo 1.052 do Código Civil. Na anônima, Lei 6.404, o capital se divide em ações, e o acionista responde pelo preço de emissão das ações que subscrever. A desconsideração da personalidade jurídica exige abuso, artigo 50, e o procedimento judicial é o incidente do artigo 133 do Código de Processo Civil. As estatais podem ser empresa pública ou sociedade de economia mista, a última sempre sob forma de sociedade anônima. Em prova: se a questão disser que a sociedade de economia mista pode ser limitada, está errada. Guarde: limitada, quotas e capital; economia mista, sempre anônima. Revise, estudante. Até a próxima lição.", "id": "64", "q": {"a": "Sociedades empresariais", "n": 74, "d": "MP e ENAM 13, Juiz 39, Defensoria 10, Analista 12; contagem aproximada"}}, {"t": "Recuperação judicial e falência: créditos da Fazenda", "link": "", "k": "new", "txt": "No tópico de hoje vamos aprender sobre a recuperação judicial e a falência, Lei 11.101, com as alterações da Lei 14.112. O crédito tributário se sujeita ao plano de recuperação? Não: ele não se submete à recuperação, e a Fazenda não vota na assembleia de credores, artigo 187 do Código Tributário e artigo 6º, parágrafo 7º-B, da lei. Na falência, a ordem de pagamento começa pelos créditos trabalhistas, até cento e cinquenta salários mínimos, e acidentes de trabalho, depois os com garantia real, e só então os tributários, artigo 83. Em prova: se a questão disser que o crédito tributário se sujeita ao plano de recuperação judicial, ou que o crédito tributário tem preferência sobre o trabalhista na falência, está errada. Guarde: tributo fora da recuperação; na falência, trabalhista vem antes. Revise, estudante. Até a próxima lição.", "id": "70", "q": {"a": "Falência / recuperação", "n": 38, "d": "MP e ENAM 19, Juiz 18, Defensoria 1, Analista 0; contagem aproximada"}}, {"t": "Títulos de crédito: princípios, cheque e prazos", "link": "", "k": "new", "txt": "O estudo de hoje é sobre os títulos de crédito. Quais são os princípios? A cartularidade, a literalidade e a autonomia. Pela autonomia, as exceções pessoais não podem ser opostas ao terceiro de boa-fé, artigo 916 do Código Civil. No cheque, Lei 7.357, o prazo de apresentação é de trinta dias, na mesma praça, e sessenta, em praça diferente. A execução prescreve em seis meses, contados do fim do prazo de apresentação, artigo 59. Perdida a força executiva, cabe ação monitória, em cinco anos, contados do dia seguinte à data de emissão, Súmula 503 do STJ. Em prova: se a questão disser que o cheque prescrito não pode ser cobrado por nenhuma ação, ou que a prescrição da execução é de cinco anos, está errada. Guarde: execução em seis meses; monitória em cinco anos. Revise, estudante. Até a próxima lição.", "id": "71", "q": {"a": "Títulos de crédito", "n": 29, "d": "MP e ENAM 4, Juiz 17, Defensoria 1, Analista 7; contagem aproximada"}}, {"t": "Propriedade industrial: patentes e marcas", "link": "", "k": "new", "txt": "No tópico de hoje vamos aprender sobre a propriedade industrial, Lei 9.279. A patente de invenção vigora por vinte anos e a de modelo de utilidade, por quinze, contados do depósito. A invenção exige novidade, atividade inventiva e aplicação industrial. Na ADI 5.529, o Supremo declarou inconstitucional a prorrogação automática do prazo da patente, que estava no parágrafo único do artigo 40. A marca é protegida pelo registro, sistema atributivo, e vale por dez anos, prorrogáveis por períodos iguais e sucessivos. Em prova: se a questão disser que a patente pode ter o prazo prorrogado automaticamente em razão da demora do INPI, ou que a marca se prorroga uma única vez, está errada. Guarde: invenção, vinte anos; modelo de utilidade, quinze; marca, dez anos prorrogáveis. Revise, estudante. Até a próxima lição.", "id": "78", "q": {"a": "Propriedade industrial", "n": 8, "d": "MP e ENAM 0, Juiz 6, Defensoria 1, Analista 1; contagem aproximada"}}]}, {"tema": "Previdenciário", "itens": [{"t": "Regime próprio: caráter contributivo e quem se vincula", "link": "", "k": "new", "txt": "O assunto de hoje é o regime próprio de previdência dos servidores. Quais são as diretrizes? Pelo artigo 40 da Constituição, o regime é de caráter contributivo e solidário, com equilíbrio financeiro e atuarial. A Emenda 103, de 2019, passou a exigir idade mínima fixada na lei do respectivo ente. Quem se vincula? Apenas o servidor ocupante de cargo efetivo. O ocupante exclusivamente de cargo em comissão, de cargo temporário ou de emprego público fica no regime geral, parágrafo 13. É vedada a contagem de tempo de contribuição fictício. Já o abono de permanência é devido a quem, tendo completado os requisitos, permanece em atividade. Em prova: se a questão disser que o servidor ocupante apenas de cargo em comissão é vinculado ao regime próprio, está errada. Guarde: regime próprio, cargo efetivo; comissão e emprego, regime geral. Revise, estudante. Até a próxima lição.", "id": "73", "q": {"a": "Previdenciário", "n": 28, "d": "MP e ENAM 0, Juiz 20, Defensoria 1, Analista 7; contagem aproximada"}}]}];
const m=document.getElementById('m'),back=document.getElementById('back'),ct=document.getElementById('ct'),bot=document.getElementById('bot');
const SZ=[16,17,19,21];let si=1;try{const v=parseInt(localStorage.getItem('ipf_sz'));if(v>=0&&v<SZ.length)si=v}catch(e){}
function applySz(){document.documentElement.style.setProperty('--fs',SZ[si]+'px')}applySz();
document.getElementById('aa').onclick=()=>{si=(si+1)%SZ.length;applySz();try{localStorage.setItem('ipf_sz',si)}catch(e){}};
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const ALL=[];D.forEach(g=>g.itens.forEach(i=>{i.tema=g.tema;ALL.push(i)}));
function home(){
 ct.textContent='Decorando pela Força';back.style.display='none';m.innerHTML='';bot.innerHTML='';
 m.appendChild(el('div','title','<big>IPelaForça</big>'));
 {const q=el('p','sub','Vídeos-aula de jurisprudência: toque no tema e leia o roteiro.');q.style.textAlign='center';m.appendChild(q)}
 D.forEach(g=>{
  const h=el('div','h');h.textContent=g.tema+' ('+g.itens.length+' tópico'+(g.itens.length>1?'s':'')+')';m.appendChild(h);
  const me=el('div','menu');
  g.itens.forEach(i=>{const a=el('a',i.k==='lit'?'':'sv','<span class="s"></span><span class="t"></span>');
   a.querySelector('.s').textContent=g.tema;a.querySelector('.t').textContent=i.t;a.href='#/'+i.id;me.appendChild(a)});
  m.appendChild(me);
 });
}
function topic(id){
 const i=ALL.findIndex(x=>x.id===id);if(i<0)return home();const t=ALL[i];
 back.style.display='';back.href='#/';ct.textContent=t.tema;m.innerHTML='';
 m.appendChild(el('div','h')).textContent=t.tema;
 const s=el('p','sub');s.textContent=t.t;m.appendChild(s);
 if(t.link){const a=el('a','rd','▶ Assistir ao vídeo');a.href=t.link;a.target='_blank';a.rel='noopener';m.appendChild(a)}
 {const p=el('p','nt');p.style.textAlign='left';p.style.margin='0 0 10px';
  p.textContent=t.q?('Questões de concurso na nossa biblioteca sobre este assunto: '+t.q.n+' ('+t.q.a+': '+t.q.d+').'):'Questões de concurso na nossa biblioteca: este tema não tem assunto próprio no ranking (aparece só como subtema de LGPD e LAI, 10 questões).';m.appendChild(p)}
 m.appendChild(el('div','h','Roteiro do vídeo'));
 if(t.k==='non'){const p=el('p','nt');p.textContent='Roteiro literal ainda não disponível neste app.';m.appendChild(p)}
 else{
  if(t.k==='new'){const p=el('p','nt');p.textContent='Roteiro novo (2ª onda), ainda sem vídeo.';m.appendChild(p)}
  if(t.k==='fic'){const p=el('p','nt');p.textContent='Texto da ficha de estudo deste vídeo (sem a abertura e o fecho da narração).';m.appendChild(p)}
  const d=el('div','fala');d.textContent=t.txt;m.appendChild(d);
 }
 const n=el('div','nv');const pr=el('a',i>0?'':'off','‹ Anterior'),ix=el('a','','Temas'),nx=el('a',i<ALL.length-1?'':'off','Próximo ›');
 pr.href=i>0?'#/'+ALL[i-1].id:'#';ix.href='#/';nx.href=i<ALL.length-1?'#/'+ALL[i+1].id:'#';n.append(pr,ix,nx);m.appendChild(n);
 bot.innerHTML='';
}
function route(){const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(s[0])topic(s[0]);else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
